<style>
/* Layout: a dark "screen" band carries the search like a subtitle line; below it, paper-light listings where every showtime is a ticket stub that books. */
:root {
  --bg: #EDF0F4;
  --surface: #FFFFFF;

  --muted: #586273;
  --line: #D3D9E1;

@media (prefers-color-scheme: dark) {

    --sub: #FFD23F; --sub-ink: #1A1400; --chip: #1C2430; --focus: #9DBBFF; color-scheme: dark;

}
:root[data-theme="dark"] {
  --bg: #0E131A; --surface: #161D26; --ink: #E7EBF0; --muted: #9AA5B5; --line: #29323E;
  --link: #9DBBFF; --screen: #05080C; --screen-ink: #E9EDF2; --screen-muted: #8E99A8;
  --sub: #FFD23F; --sub-ink: #1A1400; --chip: #1C2430; --focus: #9DBBFF; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--screen); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- top bar / screen ---------- */
.top { background: var(--screen); color: var(--screen-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.top .bar { display: flex; align-items: center; gap: 20px; padding-block: 12px; }
.brand { display: flex; align-items: baseline; gap: 6px; color: var(--screen-ink); font-family: var(--f-display); font-weight: 900; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand .ov { background: var(--sub); color: var(--sub-ink); padding: 0 6px; border-radius: 3px; }
.slot-bar { flex: 1; min-width: 0; }
.top.home { position: relative; }
.top.home .slot-bar { display: none; }

.hero { padding-block: 40px 56px; display: grid; gap: 22px; }
.hero h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(44px, 8vw, 88px); line-height: .92; letter-spacing: .005em; text-transform: uppercase; max-width: 14ch; }
.subline { display: inline-block; justify-self: start; font-size: clamp(16px, 2.2vw, 20px); color: var(--sub); font-weight: 600; background: rgba(0,0,0,.55); padding: 4px 10px; border-radius: 2px; }
.hero .meta { color: var(--screen-muted); font-size: 14px; }
.hero .meta b { color: var(--screen-ink); font-weight: 600; }

/* ---------- search ---------- */
.search { position: relative; }
.search .field { display: flex; align-items: center; gap: 10px; background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 0 12px; border: 2px solid transparent; }
.search .field:focus-within { border-color: var(--sub); }
.search svg { flex: none; color: var(--muted); }

.search input::placeholder { color: var(--muted); }
.search kbd { font-family: var(--f-mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.hero .search .field { padding: 4px 16px; }
.hero .search input { font-size: 19px; padding-block: 14px; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 18px 40px rgba(5,10,20,.28); max-height: min(70vh, 520px); overflow-y: auto; padding-block: 6px; z-index: 40; }
.results .grp { padding: 10px 14px 4px; }
.results .opt { display: flex; align-items: center; gap: 12px; padding: 8px 14px; cursor: pointer; color: var(--ink); }
.results .opt:hover, .results .opt[aria-selected="true"] { background: var(--chip); text-decoration: none; }
.results .opt .ic { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 4px; background: var(--chip); color: var(--muted); font-family: var(--f-display); font-weight: 800; font-size: 15px; }
.results .opt[aria-selected="true"] .ic { background: var(--sub); color: var(--sub-ink); }
.results .opt .tx { min-width: 0; }
.results .opt .lb { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .opt .sb { font-size: 13px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results mark { background: transparent; color: inherit; box-shadow: inset 0 -0.42em 0 color-mix(in srgb, var(--sub) 70%, transparent); }
.results .empty { padding: 14px; color: var(--muted); font-size: 14px; }
.results .hint { padding: 8px 14px 4px; font-size: 13px; color: var(--muted); }

/* ---------- page ---------- */
main { padding-block: 32px 64px; display: grid; gap: 40px; }
.crumbs { font-size: 14px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs span[aria-hidden] { opacity: .6; }
.head { display: grid; gap: 10px; }

.head .facts { color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px; }
.head .facts b { color: var(--ink); font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 12px; border-radius: var(--r); font-size: 14px; font-weight: 600; }
.btn:hover { text-decoration: none; border-color: var(--ink); }
section { display: grid; gap: 16px; }

section > .lede { color: var(--muted); margin-top: -10px; font-size: 15px; }

.badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; background: var(--chip); color: var(--muted); border: 1px solid var(--line); vertical-align: 2px; }
.badge.vo { background: var(--sub); color: var(--sub-ink); border-color: transparent; }
.lang { color: var(--muted); font-size: 14px; }

/* ticket-stub showtime */
.times { display: flex; flex-wrap: wrap; gap: 8px; }
.tix { display: inline-flex; align-items: stretch; border: 1px solid var(--line); background: var(--chip); border-radius: 4px; color: var(--ink); font-size: 13px; line-height: 1.2; overflow: hidden; }
.tix b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; padding: 7px 9px; }
.tix span { padding: 7px 9px 7px 8px; border-left: 1px dashed var(--line); color: var(--muted); display: flex; align-items: center; max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tix:hover { text-decoration: none; background: var(--screen); color: var(--sub); border-color: var(--screen); }
.tix:hover span { color: var(--screen-ink); border-left-color: var(--screen-muted); }
.howto { font-size: 13px; color: var(--muted); }

/* posters (from the cinemas) */
.thumb { flex: none; width: 46px; height: 69px; border-radius: 3px; object-fit: cover; background: var(--chip); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 22px; color: var(--muted); }
.row .t.thumbed { display: flex; gap: 14px; align-items: flex-start; }
.tt { display: grid; gap: 4px; min-width: 0; }
.results .opt img.ic { width: 30px; height: 45px; object-fit: cover; padding: 0; }
.film-head { display: grid; grid-template-columns: 200px minmax(0, 1fr); gap: 28px; align-items: start; }

.poster { width: 100%; max-width: 200px; aspect-ratio: 2 / 3; height: auto; object-fit: cover; border-radius: 4px; background: var(--chip); border: 1px solid var(--line); }

.plot { margin: 0; max-width: 65ch; }

.list { display: grid; border-top: 1px solid var(--line); }

.next { display: grid; border-top: 1px solid var(--line); }

.cin-block { display: grid; gap: 12px; padding-block: 18px; border-bottom: 1px solid var(--line); }

.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.note { font-size: 14px; color: var(--muted); max-width: 65ch; }

.stale { background: var(--sub); color: var(--sub-ink); font-size: 14px; padding-block: 8px; }

@media (max-width: 640px) {
  .top .bar { gap: 12px; }
  .brand { font-size: 22px; }

  .row { grid-template-columns: minmax(0, 1fr); }

  .poster { max-width: 140px; }

}

{"t":"Fatherland (film 2026)","ot":"","y":2026,"rt":0,"d":"Paweł Pawlikowski","wd":"Q135825188","wp":"Fatherland (film 2026)","in":"Fatherland è un film del 2026 diretto e co-sceneggiato da Paweł Pawlikowski.","al":["Fatherland"],"l":"Tedesco","s":"sott. ITA","lr":"Tedesco con sottotitoli italiani","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/92249/standard_e72f0d5c-c28e-4921-a79b-af7f25c94398.jpg","o":"Il viaggio che Thomas Mann fece nel 1949 in Germania, dopo tredici anni di esilio. Lo accompagna la figlia Erika, segnata dalle incomprensioni tra il padre e il fratello Klaus. Splendido omaggio a Rossellini (Germania anno zero, ma non solo) è un nuovo, disperato capitolo, dopo Ida e Cold War, della riflessone di Pawlikowski sull’Europa del dopoguerra. “Chiuso in un formato quadrato che, grazie anche alla fotografia in bianco e nero di Łukasz Zal, trasmette quel senso di…","g":"Storia, Dramma","id":"fatherland-film-2026"},{"t":"Digger","ot":"","y":2026,"rt":128,"d":"Alejandro González Iñárritu","wd":"Q129677718","wp":"Digger (film 2026)","in":"Digger è un film del 2026 diretto, co-sceneggiato e co-prodotto da Alejandro González Iñárritu.","l":"Inglese","s":"sott. ITA","lr":"Versione originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/93866/standard_c5e554ee-33c7-416c-b22f-fe43ef8f4623.jpeg","o":"L'uomo più potente del mondo intraprende una missione disperata per dimostrare di essere il salvatore dell'umanità, prima che il disastro da lui stesso provocato distrugga ogni cosa.","g":"Commedia","id":"digger"},{"t":"Balcanica","ot":"","y":2026,"rt":0,"d":"Nicola Sorcinelli","wd":"Q141282275","wp":"Balcanica (film)","in":"Balcanica è un film del 2026 diretto da Nicola Sorcinelli, al suo esordio alla regia.","l":"Lingua originale","s":"sott. ITA","lr":"Versione originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/98321/standard_b5240777-1f88-4dbf-b1c1-0732aa4d107f.jpeg","o":"La musica in Afghanistan è stata proibita, ed è allora che un direttore d’orchestra e suo figlio, suonatore di tuba, cercano un nuovo inizio lungo la rotta balcanica. Durante questa fuga senza fine i loro destini incroceranno quello di una dottoressa italiana. Un incontro che segnerà le vite dei due profughi e quella della giovane donna.","g":"Dramma","id":"balcanica"},{"t":"I diavoli","ot":"The Devils","y":1971,"rt":111,"d":"Ken Russell","wd":"Q655996","wp":"I diavoli","in":"I diavoli è un film del 1971 co-prodotto, scritto e diretto da Ken Russell, liberamente tratto dall'omonima trasposizione teatrale di John Whiting del romanzo storico I diavoli di Loudun di Aldous Huxley, basato sulla reale vicenda della presunta possessione demoniaca di massa d'un convento d'Orsoline della cittadina francese di Loudun nel 1634.","al":["I Diavoli (The Devils)"],"l":"Inglese","s":"sott. ITA","lr":"Inglese con sottotitoli italiani","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/92414/standard_9d3144b2-6a7c-4d2c-804b-16a2ded9ad90.jpg","o":"La vicenda è ambientata in Francia agli inizi del XVII secolo: ristabilita la pace dopo le guerre di religione, il cardinale Richelieu, per consolidare il potere regio, invia il barone di Laubardemont a Loudun, nel Poitou, con l'incarico di abbatterne le fortificazioni. Il prete Urbano Grandier, a cui l'appena deceduto governatore Sainte-Marthe ha concesso i pieni poteri fino all'elezione del suo successore, si oppone all'abbattimento delle mura cosciente che questo sarebbe…","g":"Horror, Storia, Dramma","id":"i-diavoli"},{"t":"Bardo, la cronaca falsa di alcune verità","ot":"Bardo","y":2022,"rt":174,"d":"Alejandro González Iñárritu","wd":"Q106040462","wp":"Bardo, la cronaca falsa di alcune verità","in":"Bardo, la cronaca falsa di alcune verità è un film del 2022 montato e diretto da Alejandro González Iñárritu.","al":["Bardo - La Falsa Cronaca di Alcune Verita'"],"l":"Spagnolo","s":"sott. ITA","lr":"Spagnolo con sottotitoli italiani","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/11521/standard_76951773-0dae-4b95-9c44-d9530922b378.jpg","o":"Il film segue il percorso intimo e commovente di Silverio, un noto giornalista e documentarista messicano che vive a Los Angeles. Dopo aver vinto un prestigioso premio internazionale, Silverio si sente obbligato a tornare nel paese nativo, ignaro del fatto che questo semplice viaggio lo spingerà verso i propri limiti esistenziali. La follia dei suoi ricordi e delle sue paure si estende al presente, infondendo un senso di stupore e meraviglia nella sua vita quotidiana.…","g":"Commedia, Dramma","id":"bardo-la-cronaca-falsa-di-alcune-verita"},{"t":"L'infernale Quinlan","ot":"Touch of Evil","y":1958,"rt":93,"d":"Orson Welles","wd":"Q778161","wp":"L'infernale Quinlan","in":"L'infernale Quinlan è un film del 1958 scritto, diretto e interpretato da Orson Welles, liberamente tratto dal romanzo Badge of Evil di Whit Masterson.","al":["L'infernale Quinlan (Touch of Evil)"],"l":"Inglese","s":"sott. ITA","lr":"Inglese con sottotitoli italiani","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/14547/standard_7a17c898-a21d-4476-be8a-c82969b69c00.jpg","o":"“Un complesso noir ambientato al confine tra Stati Uniti e Messico. Affiancato da un cast di prim’ordine che comprende Janet Leigh e Charlton Heston, lo stesso Orson Welles assume il ruolo principale del poliziotto corrotto Hank Quinlan. La celebre sequenza iniziale e' spettacolare, girata senza tagli, in un lungo piano sequenza che segue per tre minuti e mezzo un’auto tra le strade della cittadina di confine” (Peter Mänz). Nel suo ultimo film americano, Welles raggiunge…","g":"Thriller, Mistero, Crime","id":"l-infernale-quinlan"},{"t":"Ragazze in uniforme","ot":"Mädchen in Uniform","y":1931,"rt":88,"d":"Leontine Sagan","wd":"Q161845","wp":"Ragazze in uniforme (film 1931)","in":"Ragazze in uniforme è un film del 1931, diretto da Leontine Sagan con la supervisione di Carl Froelich, tratto dall'opera teatrale drammatica Gestern und Heute di Christa Winsloe, dal quale è stata tratta anche una versione nel 1958 ed una nel 2006.","l":"Tedesco","s":"sott. ITA","lr":"Tedesco con sottotitoli italiani","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/93338/standard_d19f3d3c-386a-4525-b001-4a5c26b5d16a.jpg","o":"Dalla pièce di Christa Winsloe, un film culto, tra i primi a parlare apertamente di lesbismo. “Le piccole tedesche di Ragazze in uniforme non hanno ancora su loro stesse e nelle loro espressioni che un accenno di femminilità. Sono veramente delle bambine, delle bambine sincere […]. Da parte mia, ritengo la realizzazione di Ragazze in uniforme un perfetto capolavoro di tatto e di misura” (Colette). Erika Mann interpreta il piccolo ruolo della signorina von Atems, l’insegnante…","g":"Romance, Dramma","id":"ragazze-in-uniforme"},{"t":"Falstaff","ot":"Chimes at Midnight","y":1965,"rt":119,"d":"Orson Welles","wd":"Q2529482","wp":"Falstaff (film)","in":"Falstaff è un film del 1965 scritto, diretto e interpretato da Orson Welles tratto da Enrico IV, parte I, Enrico IV, parte II, Enrico V, Le allegre comari di Windsor e Riccardo II di William Shakespeare.","al":["Falstaff (Campanadas a Medianoche)"],"l":"Inglese","s":"sott. ITA","lr":"Inglese con sottotitoli italiani","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/92517/standard_269e856b-f193-4245-b84d-07ac0cfa9989.jpg","o":"Falstaff, stravagante figura di gaudente avventuriero, è amico del principe di Galles e quando questi diventa re con il nome di Enrico V è convinto d'aver risolto il suo futuro. Ma gli impegni regali costringono il giovane sovrano a rinnegare le antiche e poco dignitose amicizie e il grasso Falstaff muore solo e disperato.","g":"Commedia, Guerra, Storia, Dramma","id":"falstaff"},{"t":"Sheep in the Box","ot":"箱の中の羊","y":2026,"rt":126,"d":"Hirokazu Kore-eda","wd":"Q137640905","wp":"Sheep in the Box","in":"Sheep in the Box è un film del 2026 diretto, sceneggiato e montato da Hirokazu Kore'eda.","l":"Giapponese","s":"sott. ITA","lr":"Giapponese con sottotitoli in italiano","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/91986/standard_9d5929ba-afbb-41e7-8d74-0f22e1253d2d.jpg","o":"In un futuro prossimo, a Yokohama, la coppia dei Komoto, che ha tragicamente perso il figlio di sette anni Kakeru, decide di avvalersi di REbirth, un programma pensato per le famiglie nella loro situazione: riceveranno in prova gratuita un androide guidato dall'intelligenza artificiale, con le fattezze e i ricordi di Kakeru, destinato a diventare un surrogato in tutto e per tutto del figlio perduto. Il padre Kensuke è inizialmente scettico, laddove la madre Otone si…","g":"Fantascienza, Dramma","id":"sheep-in-the-box"},{"t":"Tracking Edith","ot":"","y":2016,"rt":91,"d":"Peter Stephan Jungk","wd":"Q42325232","wp":"","in":"","l":"Tedesco","s":"sott. ITA","lr":"Tedesco con sottotitoli in italiano","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/92680/standard_4de46e11-3192-4f4f-8ac0-e7ccd70396f3.jpg","o":"Edith Tudor-Hart (Edith Suschitzky nata nel 1908 a Vienna) era un'eccellente fotografa sociale. Rivolgeva la sua attenzione agli operai e ai bambini di strada. Era anche un'abilissima spia al servizio dell'Unione Sovietica in Inghilterra. Reclutò Kim Philby e contribuì alla creazione dei Cambridge Five, la più riuscita rete di spionaggio dei servizi segreti russi.","g":"Documentario","id":"tracking-edith"},{"t":"Wittgenstein","ot":"","y":1993,"rt":72,"d":"Derek Jarman","wd":"Q178068","wp":"Wittgenstein (film)","in":"Wittgenstein è un film del 1993 diretto da Derek Jarman.","l":"Inglese","s":"sott. ITA","lr":"Inglese con sottotitoli italiani","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/92579/standard_4e168031-d055-4622-a0bd-5c55c8010f95.jpg","o":"La biografia del filosofo Ludwig Wittgenstein raccontata da Derek Jarman in modo unico e stravagante in questo piccolo ma geniale film. Jarman, artista militante per i diritti LGBTQ+, mette in scena il padre della filosofia del linguaggio rappresentando visivamente i suoi ragionamenti, i teoremi, l’avversione per il mondo accademico e la lotta per vivere liberamente la propria sessualità, in un film gioiosamente queer sia nella forma che nel contenuto. A supporto del regista…","g":"Commedia, Storia, Dramma","id":"wittgenstein"},{"t":"Stati di allucinazione","ot":"Altered States","y":1980,"rt":102,"d":"Ken Russell","wd":"Q1194524","wp":"Stati di allucinazione","in":"Stati di allucinazione è un film del 1980 diretto da Ken Russell e interpretato da William Hurt.","l":"Inglese","s":"sott. ITA","lr":"Inglese con sottotitoli italiani","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/92711/standard_d789548b-4d2f-49c0-a359-6c04c3cf24d6.jpg","o":"Eddie Jessup, giovane scienziato, rivolge i suoi interessi alle ricerche sulle origini della vita attraverso la mente umana. Aiutato da due colleghi, Jessup studia i risultati di un test cui sono stati sottoposti alcuni studenti: si tratta di immergersi in una vasca di acqua salata e di rimanere in quella posizione soli e al buio: in tal modo si arriva alla perdita di coscienza della realtà e, forse, al recupero di sensazioni appartenenti ai primordi della vita umana. Ma a…","g":"Fantascienza, Horror, Thriller","id":"stati-di-allucinazione"},{"t":"Un'ora sola ti vorrei","ot":"","y":2002,"rt":55,"d":"Alina Marazzi","wd":"Q93891113","wp":"Un'ora sola ti vorrei (film)","in":"Un'ora sola ti vorrei è un film documentario del 2002 diretto di Alina Marazzi.","l":"Italiano, inglese","s":"sott. ITA","lr":"Italiano e Inglese con sottotitoli italiani","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/5996/standard_c074e73b-6a64-4000-bb12-b546bcdcef4a.jpg","o":"UN’ORA SOLA TI VORREI (Italia/2002) di Alina Marazzi (55’) MESHES OF THE AFTERNOON (USA/1943) di Maya Deren e Alexander Hammid (14’) Alina Marazzi dà voce alla madre Liseli, scomparsa quando lei era ancora bambina, e mette in scena la propria storia personale e ico, dedicata alla vita del grande pittore di icone vissuto tra Trecento e Quattrocento. “Una visione dell’arte come dono inspiegabile e scommessa con il destino che contrasta con l’indole razionale dell’uomo e con la sua incapacità di accettarsi. Andrej Rublëv è l’artista della modernità, colui che traghetta la pittura dal formalismo bizantino a un’umanizzazione vicina a quella degli artisti rinascimentali” (Serafino…","id":"andrej-rublev"},{"t":"Strange Journey: The Story of Rocky Horror","ot":"","y":2025,"rt":90,"d":"Linus O'Brien","wd":"Q133306127","wp":"","in":"","l":"Inglese","s":"sott. ITA","lr":"Inglese con sottotitoli italiani","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/23387/standard_00b8bc32-037f-46a8-8616-d472310de370.jpg","o":"“L’ascesa, la caduta e la rinascita di Rocky Horror; il suo influsso su musica, cinema e cultura pop; il fenomeno cult senza precedenti che ha generato. Rocky Horror è unico nel modo in cui ha creato comunità e spazi in cui potersi esprimere senza timore di giudizio – in cui sentirsi liberi in ogni scelta e a proprio agio con chi condivideva quello spirito. Questo documentario non celebra solo Rocky Horror, ma anche tutte queste persone”. Linus O’Brien racconta la storia del…","g":"Documentario","id":"strange-journey-the-story-of-rocky-horror"},{"t":"Ritorno a Buenos Aires","ot":"","y":2026,"rt":104,"d":"Marco Bechis","wd":"Q140680798","wp":"Ritorno a Buenos Aires","in":"Ritorno a Buenos Aires è un film del 2026 diretto da Marco Bechis.","l":"Italiano, spagnolo","s":"","lr":"Italiano, Spagnolo","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/85221/standard_c277cd42-663b-4aa4-adbe-a5d811af5536.jpg","o":"Buenos Aires, 2008. Dopo trentatré anni trascorsi in Italia, Mariano Guerra torna in Argentina per testimoniare al processo contro gli ex militari che lo sequestrarono, torturarono e resero schiavo durante la dittatura militare. Insieme ad altri sopravvissuti è ospitato negli alloggi del Ministero della Giustizia, dove ritrova persone che hanno condiviso la prigionia e attende il giorno della sua deposizione. Le giornate trascorse con gli altri testimoni, gli incontri e le…","g":"Drammatico","id":"ritorno-a-buenos-aires"},{"t":"The Rocky Horror Picture Show","ot":"","y":1975,"rt":100,"d":"Jim Sharman","wd":"Q751921","wp":"The Rocky Horror Picture Show","in":"The Rocky Horror Picture Show è un film del 1975 co-sceneggiato e diretto da Jim Sharman.","al":["The Rocky Horror Picture Show - 50° Anniversary"],"l":"Inglese","s":"sott. ITA","lr":"Inglese con sottotitoli italiani","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/15065/standard_48f9a71c-05cc-4ad8-b9a8-65834890d26d.jpg","o":"Una coppia di ingenui fidanzatini finisce nel castello dello bizzarro scienziato Dr. Frank-N-Furter. È l’inizio di un viaggio tra musica, sesso e follia in un cult che sovverte ogni regola con ironia e travolgente libertà. Intramontabile, con schiere di seguaci che tuttora frequentano mascherati le proiezioni in giro per il mondo. Uno spettacolo d’arte varia che tiene insieme alieni travestiti e case infestate, tutto sorretto da una poderosa colonna sonora kitsch-rock.","g":"Commedia, Fantascienza, Horror, Fantasy","id":"the-rocky-horror-picture-show"},{"t":"Palestina 36 - Quando tutto ebbe inizio","ot":"","y":2025,"rt":0,"d":"Annemarie Jacir","wd":"Q132853314","wp":"Palestina 36 - Quando tutto ebbe inizio","in":"Palestina 36 - Quando tutto ebbe inizio è un film del 2025 diretto e sceneggiato da Anne-Marie Jasir.","al":["Palestina 36"],"l":"Arabo, inglese","s":"sott. ITA","lr":"Arabo e inglese con sottotitoli italiani","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/79940/standard_8767a825-20eb-41e5-b51e-7a5dd577d444.jpg","o":"Ambientato nel 1936 durante la rivolta palestinese contro il dominio coloniale britannico. Il film segue Yusuf, che si muove tra il suo villaggio rurale e la caotica Gerusalemme, mentre la regione si avvicina a un momento cruciale. La narrazione esplora le vite di diversi personaggi, inclusi un contadino, un operaio portuale e una madre vedova, evidenziando le tensioni di classe e l'impatto della crescente immigrazione ebraica.","g":"Guerra, Storia, Dramma","id":"palestina-36-quando-tutto-ebbe-inizio"},{"t":"F come falso","ot":"Vérités et Mensonges","y":1973,"rt":89,"d":"Orson Welles","wd":"Q2251852","wp":"F come falso","in":"F come falso è un film del 1973 diretto e interpretato da Orson Welles.","al":["F Come Falso - Verità e Menzogna (F for Fake)"],"l":"Inglese, francese, spagnolo","s":"sott. ITA","lr":"Inglese, francese, spagnolo con sottotitoli italiani","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/92811/standard_858a458c-2e88-48b5-a352-c664eb6e0a91.jpg","o":"Orson Welles narra direttamente allo spettatore diverse storie riguardanti quadri falsi e veri, falsari di professione e critici d'arte che scambiano i quadri dei falsari per veri: tra questi, Elmyr de Hory, che falsificava celebri quadri, Clifford Irving, che falsificava biografie, il miliardario Howard Hughes e il pittore Pablo Picasso.","g":"Documentario","id":"f-come-falso"},{"t":"China Blue","ot":"Crimes of Passion","y":1984,"rt":101,"d":"Ken Russell","wd":"Q734116","wp":"China Blue (film 1984)","in":"China Blue è un film statunitense del 1984 diretto da Ken Russell, con Kathleen Turner ed Anthony Perkins.","l":"Inglese","s":"sott. ITA","lr":"Inglese con sottotitoli italiani","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/92843/standard_a642f0f4-9e23-4dda-9f8b-536e08a4f06a.jpg","o":"Joanna Crane ha una doppia vita a schizofrenia libera: strapagata stilista di giorno, tutta casa e lavoro, al calar del sole si traveste da prostituta e va a battere i marciapiedi dell'infima Los Angeles. Film truculento e trito, indigesta mistura di naturalismo attardato, decadentismo decorativo, infantilismo freudiano, greve moralismo e congenita ruffianeria mercantile. Il talento di K. Russell affiora qua e là a schegge.","g":"Thriller, Dramma, Crime","id":"china-blue"},{"t":"Trainspotting","ot":"","y":1996,"rt":94,"d":"Danny Boyle","wd":"Q109135","wp":"Trainspotting (film)","in":"Trainspotting è un film del 1996 diretto da Danny Boyle.","l":"Inglese","s":"sott. ITA","lr":"inglese con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/118617/standard_5f4d3e50-8ed2-447f-8c8a-0b6f286ba202.jpg","o":"Edimburgo. Mark Renton, ladruncolo per necessità, ha scelto un'onesta e sincera tossicodipendenza. Begbie, uno psicopatico violento e alcolizzato spaventa perfino i suoi amici, ma non si sognerebbe nemmeno di toccare la droga. Spud, un disperato, ma amabile eroinomane. Sick Boy, un narciso dalle conoscenze enciclopediche su Sean Connery, in grado di tenere sotto controllo la propria dipendenza dall'eroina. Poi c'è Tommy che non si droga, è un maniaco delle escursioni…","g":"Drammatico","id":"trainspotting"},{"t":"Happiness - Felicità","ot":"Happiness","y":1998,"rt":134,"d":"Todd Solondz","wd":"Q1426532","wp":"Happiness - Felicità","in":"Happiness - Felicità (Happiness) è un film del 1998 scritto e diretto da Todd Solondz.","l":"Inglese, russo","s":"sott. ITA","lr":"inglese/russo con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/109905/standard_4b521cb0-3b3e-434e-91b7-06fdb0145cbe.jpg","o":"New Jersey. A trent'anni Joy vive ancora nella casa dei genitori, nella speranza di trovare l'uomo della sua vita. Le sue sorelle, Helen e Trish, la compatiscono, ma anche loro sono alle prese con problemi sentimentali. Helen comincia a flirtare con un anonimo molestatore telefonico, non sapendo che si tratta del suo vicino di casa, Allen, che sfoga le sue difficoltà sul piano affettivo con l'analista Bill, marito di Trish, attratto dai minorenni.","g":"Grottesco","id":"happiness-felicita"},{"t":"La signora ammazzatutti","ot":"Serial Mom","y":1994,"rt":95,"d":"John Waters","wd":"Q610670","wp":"La signora ammazzatutti","in":"La signora ammazzatutti è un film del 1994 scritto e diretto da John Waters.","al":["La Signora Ammazzatutti (Serial Mom)"],"l":"Inglese","s":"sott. ITA","lr":"inglese con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/109938/standard_3c39c1ad-9699-4275-af83-34a668cc1e8a.jpg","o":"La famiglia Suthpin possiede tutto. La felicità familiare è difesa con i denti da mamma Suthpin affinché nulla incrini la perfezione del focolare domestico. A parte questo Beverly Suthpin coltiva due bizzarri hobbies: farsi mandare cassette con la voce del famoso serial killer Ted Bundy e tormentare con telefonate oscene Dottie Hinkle, rea di averle inflitto uno sgarbo al supermarket. Quando la figlia si lamenta delle scarse attenzioni del suo fidanzato e un professore…","g":"Commedia","id":"la-signora-ammazzatutti"},{"t":"Nel bel mezzo di un gelido inverno","ot":"A Midwinter's Tale","y":1995,"rt":99,"d":"Kenneth Branagh","wd":"Q2245295","wp":"Nel bel mezzo di un gelido inverno","in":"Nel bel mezzo di un gelido inverno è un film del 1995 diretto da Kenneth Branagh.","al":["Nel Bel Mezzo di un Gelido Inverno (In the Bleak Midwinter)"],"l":"Inglese","s":"sott. ITA","lr":"inglese con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/109971/standard_6e539140-a3c8-4a95-96f7-ab98960250ef.jpg","o":"Poco prima di Natale, in un paesino del Surrey, una scalcagnata compagnia di interpreti eccentrici e nevrotici prepara la messa in scena di \"Amleto\" in una chiesa che sta per essere abbattuta. Li dirige Joe Harper, un attore frustrato per l'abbandono della ragazza e la troppo lunga disoccupazione.","g":"Commedia","id":"nel-bel-mezzo-di-un-gelido-inverno"},{"t":"L'amore bugiardo - Gone Girl","ot":"Gone Girl","y":2014,"rt":149,"d":"David Fincher","wd":"Q14920425","wp":"L'amore bugiardo - Gone Girl","in":"L'amore bugiardo - Gone Girl è un film thriller psicologico del 2014 diretto da David Fincher e scritto da Gillian Flynn, basato sul suo romanzo omonimo del 2012.","l":"Inglese","s":"sott. ITA","lr":"inglese con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/453/standard_e07f8fe4-1d3e-4ad4-871d-98c3a7ee9fe1.jpg","o":"Da poco trasferitisi in una piccola cittadina del Missouri da New York, Nick Dunne e la moglie Amy stanno attraversando un periodo difficile, con un matrimonio in crisi per via della difficoltà della donna ad abituarsi alla nuova esistenza. Il giorno del quinto anniversario di nozze, Amy scompare e il primo ad essere sospettato della sua scomparsa è Nick ma la realtà è ben diversa da come appare a prima vista.","g":"Drammatico","id":"l-amore-bugiardo-gone-girl"},{"t":"Ragazze interrotte","ot":"Girl, Interrupted","y":1999,"rt":122,"d":"James Mangold","wd":"Q463101","wp":"Ragazze interrotte","in":"Ragazze interrotte è un film drammatico del 1999 diretto da James Mangold, con Winona Ryder e Angelina Jolie come protagoniste.","al":["Ragazze Interrotte (Girl, Interrupted)"],"l":"Inglese","s":"sott. ITA","lr":"inglese con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/109872/standard_2eced4ac-7df3-4f5e-80c1-e4dc13e21a90.jpg","o":"Susanna annota in un diario le riflessioni, gli episodi, i giudizi sulle sue giornate al Claymoore Hospital. I pensieri e le parole tengono insieme i frammenti di due anni passati, dal 1967 al 1969, in un ospedale psichiatrico in mezzo ad altre creature malate. Ragazze difficili, implose, e donne adulte, affettuose e dure. Lisa, la leader sociopatica del gruppo, Daisy, vorace consumatrice di polli arrosto e di lassativi. Polly, una elephant-girl con il volto ustionato.","g":"Drammatico","id":"ragazze-interrotte"},{"t":"Jennifer's Body","ot":"","y":2009,"rt":102,"d":"Karyn Kusama","wd":"Q861640","wp":"Jennifer's Body","in":"Jennifer's Body è un film del 2009 diretto da Karyn Kusama e scritto da Diablo Cody.","l":"Inglese","s":"sott. ITA","lr":"inglese con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/111103/standard_9aa4534b-2e62-493b-9373-cccd73a1b47f.jpg","o":"Jennifer è un adolescente bellissima e popolare, ed è la migliore amica di Needy meno popolare e bella di lei, ma si conoscono sin dall'infanzia. Una sera Jennifer e Needy vanno ad una festa di un nuovo gruppo rock il cui leader è un ragazzo di nome Nikolai. Jennifer si invaghisce di questo Nikolai e vuole assolutamente portarselo a letto. Al concerto in cui suona la band diverse persone prendono fuoco improvvisamente e muoiono carbonizzate. Nikolai riesce a prendere…","g":"Horror","id":"jennifer-s-body"},{"t":"Don't Worry Darling","ot":"","y":2022,"rt":122,"d":"Olivia Wilde","wd":"Q100801718","wp":"Don't Worry Darling","in":"Don't Worry Darling è un film del 2022 diretto da Olivia Wilde.","l":"Inglese","s":"sott. ITA","lr":"inglese con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/15609/standard_9d79be04-4d11-4269-b68a-2308ec6ef05d.jpg","o":"Alice e Jack hanno la fortuna di vivere nella comunità idealizzata di Victory, la città realizzata da un’azienda sperimentale che ospita, assieme alle loro famiglie, gli uomini che lavorano al progetto top-secret Victory. L’ottimismo sociale degli anni ’50 sposato dal loro amministratore delegato, Frank – a metà tra un uomo d’azienda visionario ed un life coach motivazionale – fissa ogni aspetto della vita quotidiana di questo luogo utopico nel mezzo del deserto. Mentre i…","g":"Drammatico","id":"don-t-worry-darling"},{"t":"Coyote vs. Acme","ot":"","y":2026,"rt":103,"d":"Dave Green","wd":"Q106392679","wp":"Coyote vs. Acme","in":"Coyote vs. Acme è un film del 2026 diretto da Dave Green.","l":"Inglese","s":"sott. ITA","lr":"inglese con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/106275/standard_21601168-e098-4e94-a266-87b1a3692290.jpg","o":"Per generazioni di spettatori, Willy il Coyote è stato il più ostinato dei sognatori. Da decenni insegue Beep Beep senza mai riuscire ad acchiapparlo, finendo puntualmente vittima dei marchingegni più improbabili prodotti dalla Acme. Tra esplosioni, precipizi, razzi impazziti e invenzioni difettose, è diventato uno dei simboli più universali, divertenti e romantici del fallimento, ma anche e soprattutto della perseveranza. Willy cade, si rialza e riprova sempre. È forse…","g":"Avventura","id":"coyote-vs-acme"},{"t":"The Vanishing - Scomparsa","ot":"The Vanishing","y":1993,"rt":109,"d":"George Sluizer","wd":"Q616301","wp":"The Vanishing - Scomparsa","in":"The Vanishing - Scomparsa è un film del 1993 diretto da George Sluizer.","l":"Inglese","s":"sott. ITA","lr":"inglese con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/114558/standard_a51eec82-f1eb-47fc-a2a6-9b74e29eddf5.JPG","o":"Un olandese perde le tracce di sua moglie durante il soggiorno in Francia. Tre anni più tardi uno psicopatico, che apparentemente conduce una vita normale, lo rintraccia e afferma di essere la causa della sparizione.","g":"Horror","id":"the-vanishing-scomparsa"},{"t":"Hope","ot":"호프","y":2026,"rt":157,"d":"Na Hong-jin","wd":"Q117429496","wp":"Hope (film 2026)","in":"Hope è un film del 2026 diretto, sceneggiato e co-prodotto da Na Hong-jin.","l":"Coreano, inglese","s":"sott. ITA","lr":"coreano/inglese con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/119574/standard_d3be93eb-5b68-4200-9acf-b539829f29b9.jpg","o":"La polizia indaga sulla presenza di una creatura misteriosa che ha gettato nello scompiglio un remoto villaggio nella Baia della Speranza. Seguendo le tracce dell’animale, un gruppo di cacciatori diventa la sua preda: questo pone le basi per un conflitto che si trasformerà in una tragedia cosmica.","g":"Fantascienza, Azione","id":"hope"},{"t":"Maratona Halloween: Creature a Sorpresa","l":"Lingua originale","s":"sott. ITA","lr":"originale sottotitolata","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/120564/standard_1b5f5bde-0cf8-4cf3-ab34-0f53f67bcba8.jp
