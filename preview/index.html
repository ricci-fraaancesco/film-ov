ot":"","y":2025,"rt":84,"d":"Grace Glowicki","wd":"Q131920948","wp":"","in":"","l":"Inglese","s":"sott. ITA","lr":"inglese con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/114626/standard_587d9e80-7dd4-444d-a0c8-c390d827b872.jpg","o":"In un cimitero illuminato dalla luna, una beccaia solitaria sogna di trovare l'amore, ma teme che l'onnipresente fetore della morte l'abbia condannata a rimanere sola per sempre. Finché un giorno un funerale non la mette in contatto con un poeta romantico e stravagante, che sembra trovare il suo tanfo morboso irresistibile. I due si dichiarano amore eterno, ma la loro relazione passionale si interrompe quando il poeta muore improvvisamente in mare. Con nient'altro che un…","g":"Horror","id":"dead-lover"},{"t":"The Glorious Dead","l":"Inglese","s":"sott. ITA","lr":"inglese con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/114627/standard_db9d6c3d-cdfb-4974-a06e-2d9863b6367e.jpg","o":"Lo sceriffo di una piccola città e il suo vice si risvegliano in un mondo trasformato, dove il sangue gocciola dai rubinetti, le persone scompaiono, misteriose creature si aggirano per la foresta e i morti risorgono, mentre la città sprofonda nel caos.","d":"Toby Poser, John Adams","y":2026,"g":"Horror","id":"the-glorious-dead"},{"t":"La Virgen de la Tosquera","ot":"","y":2025,"rt":90,"d":"Laura Casabé","wd":"Q131428552","wp":"","in":"","al":["The Virgin of the Quarry Lake"],"l":"Spagnolo","s":"sott. ITA","lr":"spagnolo con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/114628/standard_66700a6b-3d53-4801-8672-96c10e220675.jpg","o":"Alla vigilia dello scoppio dell'epidemia del 2001, Natalia si innamora perdutamente di Diego, suo amico di sempre. La storia d'amore si interrompe quando lui incontra Silvia, una ragazza più esperta. Con l'aiuto della nonna Rita, Natalia decide di ricorrere a incantesimi e maledizioni per ostacolare la relazione nascente tra Diego e Silvia.","g":"Horror","id":"la-virgen-de-la-tosquera"},{"t":"Leviticus","ot":"","y":2026,"rt":86,"d":"Adrian Chiarella","wd":"Q137557964","wp":"Leviticus","in":"Leviticus è un film horror romantico australiano del 2026 scritto e diretto da Adrian Chiarella","l":"Inglese","s":"sott. ITA","lr":"inglese con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/114629/standard_9f42f81e-af05-40f0-81db-fe870febae94.jpg","o":"Due ragazzi adolescenti devono sfuggire a un'entità violenta che assume la forma della persona che desiderano di più: l'uno dell'altro.","g":"Horror","id":"leviticus"},{"t":"Hereditary - Le radici del male","ot":"Hereditary","y":2018,"rt":127,"d":"Ari Aster","wd":"Q47524071","wp":"Hereditary - Le radici del male","in":"Hereditary - Le radici del male (Hereditary) è un film del 2018 scritto e diretto da Ari Aster, al suo esordio cinematografico.","l":"Inglese","s":"sott. ITA","lr":"Lingua originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/18299/standard_89697362-4679-4aca-b2f3-d1d6a2a4633d.jpg","o":"Quando l'anziana Ellen muore, i suoi familiari cominciano lentamente a scoprire una serie di segreti oscuri e terrificanti sulla loro famiglia che li obbligherà ad affrontare il tragico destino che sembrano aver ereditato.","g":"Horror, Thriller, Mistero","id":"hereditary-le-radici-del-male"},{"t":"It Ends","ot":"","y":2025,"rt":90,"d":"Alexander Ullom","wd":"Q133546293","wp":"","in":"","l":"Inglese","s":"sott. ITA","lr":"Lingua originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/120960/standard_094b6ff7-fecd-4314-a044-643259de8747.jpg","o":"Quattro amici appena diplomati partono per un giro in auto a tarda notte, sperando di godersi un’ultima serata insieme prima che le loro vie si dividano, ma si ritrovano intrappolati in una misteriosa strada senza fine, circondati da fenomeni inspiegabili e presenze terrificanti. Mentre la realtà sembra sgretolarsi intorno a loro, dovranno decidere se accettare il proprio destino o tentare una fuga impossibile.","g":"Horror, Mistero","id":"it-ends"},{"t":"Primetime","ot":"","y":2026,"rt":110,"d":"Lance Oppenheim","wd":"Q133273688","wp":"Primetime (film)","in":"Primetime è un film del 2026 diretto da Lance Oppenheim, al suo esordio come regista di un lungometraggio cinematografico.","l":"Inglese","s":"sott. ITA","lr":"Lingua originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/117199/standard_726065af-2010-4981-8d35-56804a9ba2b5.jpg","o":"Nel 2006 il giornalista Chris Hansen si prepara a fare la storia della televisione con To Catch a Predator, il controverso format che, attraverso operazioni sotto copertura e telecamere nascoste, smaschera in diretta tv predatori sessuali colti sul fatto. Mentre il programma diventa un fenomeno nazionale e il suo conduttore un’icona del pubblico, il confine tra informazione, giustizia e spettacolo si fa sempre più ambiguo e il cortocircuito fra cronaca, intrattenimento e…","g":"Thriller, Dramma","id":"primetime"},{"t":"Avengers: Doomsday","l":"Inglese","s":"sott. ITA","lr":"Lingua originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/117198/standard_5329d09e-f352-4896-a4be-ff2d36a6ce71.jpg","o":"Gli universi si scontrano e la Saga del Multiverso inizia il suo capitolo finale. Gli amati eroi di tre universi distinti si troveranno su una rotta di collisione mortale e dovranno affrontare una minaccia esistenziale diversa da qualsiasi altra abbiano mai incontrato.","d":"Joe Russo, Anthony Russo","y":2026,"g":"Avventura, Fantascienza, Azione","id":"avengers-doomsday"},{"t":"Midsummer Formula","l":"Giapponese","s":"sott. ITA","lr":"giapponese con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/110598/standard_249fc166-823d-4d14-a2c4-0595b6046272.jpg","o":"Manabu Yukawa viene invitato per una presentazione al Submarine Mineral Resources Development di Harigaura. L'uomo alloggia presso una locanda dove incontra Kyohei, nipote dei proprietari dell'hotel in vacanza, La mattina seguente Tsukahara, un altro degli ospiti della locanda, viene trovato morto sulla banchina del porto e Manabu, suo malgrado, si ritrova coinvolto nel caso.","d":"Hiroshi Nishitani","y":2026,"g":"Giallo","id":"midsummer-formula"},{"t":"Dollhouse","ot":"ドールハウス","y":2025,"rt":110,"d":"Shinobu Yaguchi","wd":"Q133728943","wp":"","in":"","l":"Giapponese","s":"sott. ITA","lr":"giapponese con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/110664/standard_dabe423b-1efb-4e6a-bd9f-ff854501954c.jpg","o":"Yoshie e Tadahiko sono sposati e hanno una figlia di 5 anni di nome Mei, che muore tragicamente. Dopo aver subito una perdita tanto irreparabile, Yoshie cade in una spirale di disperazione. Un giorno, trova una bambola che somiglia a Mei in un mercato dell'antiquariato e la compra.","g":"Horror","id":"dollhouse"},{"t":"Summer Blooms","ot":"四月の永い夢","y":2018,"rt":0,"d":"Ryūtarō Nakagawa","wd":"Q55421839","wp":"","in":"","l":"Giapponese","s":"sott. ITA","lr":"giapponese con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccb/uploads/film/playbill/110665/standard_03d67d53-5964-4336-9eee-a5b2b482811e.JPG","o":"Hatsumi Takimoto abbandona il suo lavoro di insegnante e inizia a lavorare part-time in un piccolo bar a conduzione familiare. Tuttavia, il passato da cui è fuggita si ripresenta quando una sua ex studentessa, cantante jazz in difficoltà, le chiede aiuto per fuggire da una relazione violenta. Questo confronto costringe Hatsumi a riflettere sul passato e sugli ideali romantici che ha soppresso dopo la morte del compagno, avvenuta 3 anni prima.","g":"Drammatico","id":"summer-blooms"},{"t":"Pòs Processo Crime","l":"Lingua originale","s":"sott. ITA + ENG","lr":"Versione originale con sottotitoli in italiano e inglese","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/92086/standard_7c962dc8-302a-4058-b987-82994a7109b7.png","o":"Winter Blumen Garten Sara Piñeros Cortés (Austria-Colombia, 2025, 28’) Pòs Processo Crime Susana de Sousa Dias (Portogallo, 2025, 48’) Winter Blumen Garten Due donne si scambiano lettere cinematografiche che attraversano il passato e il presente. Heidrun, una donna viennese ritratta attraverso filmati d’archivio, e Sara, una migrante colombiana che lavora al Museo del Cinema austriaco. Pòs Processo Crime Nel 2000, Susana de Sousa Dias ha realizzato Criminal Case 141/53…","d":"Susana De Sousa Dias","y":2026,"g":"Documentario","id":"pos-processo-crime"},{"t":"Az Zeeb","l":"Lingua originale","s":"sott. ITA + ENG","lr":"Versione originale con sottotitoli in italiano e inglese","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/92117/standard_0a535fb0-abb1-4a16-83e5-71a2437c871e.jpg","o":"Forgotten Spaceman (Hershewe Fazanawerd) Elham Ehsas (Afghanistan, UK, 2026, 16’) Az Zeeb Rafael Guendelman Hales (Cile-Qatar, 2026, 86’) Forgotten Spaceman Nel 1988 l’Afghanistan mandò nello spazio il suo unico astronauta: un viaggio che dimostrò come la propria casa possa essere più lontana delle stelle. Az Zeeb Rafael, regista cileno con padre ebreo e madre palestinese, scopre, dopo la morte della nonna, più di quaranta pellicole in Super8 e diversi quaderni di traduzioni…","d":"Rafael Guendelman","y":2026,"g":"Documentario","id":"az-zeeb"},{"t":"Benita","l":"Lingua originale","s":"sott. ITA + ENG","lr":"Versione originale con sottotitoli in italiano e inglese","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/92150/standard_ebe1f0cd-4d51-4e55-8f94-9d572b8495f0.jpg","o":"Equal Dust (Elämä ja yö) Jani Peltonen (Finlandia, 2026, 14’) BENITA Alan Berliner (USA, 2025, 81’) Equal Dust. Le esercitazioni nucleari della NATO, una ripresa in carrellata attraverso la Helsinki notturna e i brani presentati dalla Finlandia all’Eurovision Song Contest mostrano come si immaginava la fine del mondo negli anni ’80. BENITA. Un documentario profondamente intimo e struggente nel quale Alan Berliner disegna un ritratto dell’amica e collega newyorkese Benita…","d":"Alan Berliner","y":2026,"g":"Documentario","id":"benita"},{"t":"Cara a Cara","l":"Lingua originale","s":"sott. ITA + ENG","lr":"Versione originale con sottotitoli in italiano e inglese","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/92183/standard_4df2597a-06d6-4798-b800-144cf645f08c.jpg","o":"L’uomo più bello del mondo Paolo Baiguera (Italia, 2026, 18’) Cara a Cara Federico Veiroj (Uruguay-Argentina, 2025, 70’) L’uomo più bello del mondo Un tabù di famiglia, una storia perduta. Attraverso 25 fotografie e le fredde analisi dell’intelligenza artificiale contrapposte ai calorosi ricordi di sua madre, un nipote ricostruisce la vita di Michele, uno zio scomparso a causa dell’AIDS e dell’eroina nell’Italia degli anni ’80 e ’90, esplorando la memoria, il valore delle…","d":"Federico Veiroj","y":2026,"g":"Documentario","id":"cara-a-cara"},{"t":"The Clearing","ot":"","y":2020,"rt":0,"d":"Sabine Groenewegen","wd":"Q113598104","wp":"","in":"","l":"Inglese","s":"sott. ITA + ENG","lr":"Versione originale con sottotitoli in italiano e inglese","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/92084/standard_6f708404-d905-4450-8509-cfa7d06d9a25.jpg","o":"All’inizio del XX secolo, le forze coloniali olandesi trasformarono la foresta pluviale di Sumatra in immense piantagioni di gomma. Dai Paesi Bassi, gli uomini arrivarono in massa sull’isola per dirigere una forza lavoro a contratto sottoposta a condizioni prossime alla schiavitù. Lo sfruttamento sessuale delle donne, un segreto noto a tutti ma taciuto, divenne uno dei pilastri di quel sistema coloniale. Le contraddizioni razziali su cui si fondava quel mondo alimentarono…","id":"the-clearing"},{"t":"Où Vivre Insist","l":"Lingua originale","s":"sott. ITA + ENG","lr":"Versione originale con sottotitoli in italiano e inglese","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/92184/standard_1e9ff9df-cd4d-45c9-b1a0-6907bdf25836.jpg","o":"Intersecting Memory (ذاكرة متقاطعة) Shayma' Awawdeh (Francia-Palestina, 2025, 20’) Où vivre insiste Aude Fourel (Francia-Germania-Algeria, 2026, 65’) Intersecting Memory Un ricordo d’infanzia mi riporta ai giorni della Seconda Intifada a Hebron, in Palestina, dove la paura, l’assedio e la morte caratterizzano ogni momento sotto l’occupazione. Où vivre insiste Aude Fourel filma Monica Maurer e Cahide Ozel, due cineaste di contesti e generazioni diverse unite dalle immagini…","d":"Aude Fourel","y":2026,"g":"Documentario","id":"ou-vivre-insist"},{"t":"Auber 89","l":"Lingua originale","s":"sott. ITA + ENG","lr":"Versione originale con sottotitoli in italiano e inglese","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/92085/standard_edeb184f-11b1-4ea4-98f6-45ad52d87ea9.jpg","o":"Cento ore di found footage dagli archivi del Comune di Aubervilliers. Le immagini, girate negli anni ’80 durante un ambizioso progetto di riqualificazione urbana, ritraggono un quartiere impegnato a migliorare le proprie condizioni di vita e a immaginare un futuro migliore. Muovendosi tra passato e presente, Auber 89 rivisita un fugace momento di speranza prima che la disillusione ridisegnasse la periferia parigina, mentre le texture della televisione e delle videocassette…","d":"Giuseppe Schillaci","y":2026,"g":"Documentario","id":"auber-89"},{"t":"Possible Love","ot":"가능한 사랑","y":2026,"rt":0,"d":"Lee Chang-dong","wd":"Q137843740","wp":"Possible Love","in":"Possible Love è un film del 2026 diretto, co-sceneggiato e co-prodotto da Lee Chang-dong.","l":"Coreano","s":"sott. ITA","lr":"Originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/83909/standard_49dba430-d923-4e7a-8fa9-3cf82ac8c8a4.jpg","o":"Due coppie sposate, due mondi che si incontrano attraverso la macchina da presa: un lavoratore licenziato e sua moglie, una documentarista e suo marito. Mentre collaborano alla realizzazione di un film, le loro strade si intrecciano, rivelando differenze profonde e desideri inconfessati, costringendoli ad affrontare verità scomode sull'amore e sull'impegno.","g":"Drammatico","id":"possible-love"},{"t":"Il Tempo di Anne","ot":"LOL 2.0","y":2026,"rt":0,"d":"Lisa Azuelos","wd":"Q135224617","wp":"","in":"","l":"Francese","s":"sott. ITA","lr":"Originale con sottotitoli italiani","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/78563/standard_231c1739-7143-4101-991e-e9cda5014bcb.jpg","o":"Sophie Marceau (Il tempo delle mele) torna a confrontarsi con il trascorrere del tempo, lungo un percorso che l’ha resa una delle figure più rappresentative del cinema francese. Anne si gode finalmente la sua libertà dopo la partenza dei figli. Ma tutto cambia quando sua figlia Louise torna a vivere con lei in seguito a un fallimento professionale e sentimentale. E siccome le sorprese non arrivano mai da sole, suo figlio Théo le annuncia che sta per diventare nonna. Tra…","g":"Commedia","id":"il-tempo-di-anne"},{"t":"Nata ieri","ot":"Born Yesterday","y":1950,"rt":103,"d":"George Cukor","wd":"Q375594","wp":"Nata ieri (film 1950)","in":"Nata ieri è un film del 1950 diretto da George Cukor.","al":["Nata Ieri (Born Yesterday)"],"l":"Inglese","s":"sott. ITA","lr":"Originale con i sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/70313/standard_8abbe507-a5b4-4213-bf32-853ab8be3e74.png","o":"Judy Holliday era come il Dr. Jekyll: aveva un quoziente in tellettivo sopra la media, ma ogni sera a Broadway diven tava Billie Dawn, oca bionda e rozza che, con l’aiuto di un paio d’occhiali, tanta volontà e un intellettuale strafigo, si trasformava in Mrs. Hyde — al contrario. Il successo fu enorme. Harry Cohn della Columbia Pictures comprò i di ritti pensando a Rita Hayworth. Ci fu una sommossa e Judy si trasformò anche per lo schermo. Meno male: il cinema rende…","g":"Commedia, Romance","id":"nata-ieri"},{"t":"Donne","ot":"The Women","y":1939,"rt":130,"d":"George Cukor","wd":"Q348678","wp":"Donne (film 1939)","in":"Donne è un film del 1939 diretto da George Cukor.","al":["Donne (The Women)"],"l":"Inglese","s":"sott. ITA","lr":"originale con i sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/70346/standard_59074d41-fc5d-4e7e-826f-a6d6a8b2b5ee.png","o":"Non c’erano maschi in scena a Broadway e così fu anche nel film: cast femminile (anche i cani sono femmine) in questa battaglia di dame. Mary Haines appartiene alla buona società. Crystal Allen, commessa senza scrupoli — chi meglio di Joan Crawford? — le ruba il marito e sale la scala sociale. Intorno, un coro di leonesse e agnellini: pettegole, arriviste, di buon senso, scellerate. Un campionario poco femminista, ma fa ridere davvero.","id":"donne"},{"t":"My Fair Lady","ot":"","y":1964,"rt":171,"d":"George Cukor","wd":"Q201215","wp":"My Fair Lady (film)","in":"My Fair Lady è un film del 1964 diretto da George Cukor, tratto dall'omonimo musical del 1956 di Alan Jay Lerner e Frederick Loewe, ispirato a sua volta dall'opera Pigmalione di George Bernard Shaw.","l":"Inglese","s":"sott. ITA","lr":"originale con i sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/70347/standard_23425a26-bd35-44bb-a684-ef6644cd538f.png","o":"In principio era Pigmalione di George Bernard Shaw. Nel 1956 divenne una commedia musicale di Alan Jay Lerner e Frederick Loewe con un record di 2717 repliche (sette anni sette). Quando arrivò sugli schermi, Cary Grant rifiutò la parte del professor Higgins, il glottologo reso immortale da Rex Harrison. Audrey Hepburn prese invece il posto di Julie Andrews, la cockney sottoposta al tour de force rieducativo. Scelta criticata da molti, ma i fans di Audrey godono ancora oggi.","g":"Commedia, Romance","id":"my-fair-lady"},{"t":"Pranzo alle otto","ot":"Dinner at Eight","y":1933,"rt":111,"d":"George Cukor","wd":"Q722648","wp":"Pranzo alle otto","in":"Pranzo alle otto è un film del 1933 diretto da George Cukor.","al":["Pranzo alle Otto (Dinner at Eight)"],"l":"Inglese","s":"sott. ITA","lr":"originale con i sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/70412/standard_02a64b29-32fe-4916-947b-f254860df037.png","o":"George Cukor era imbattibile quando adattava le commedie di Broadway. Conosceva il teatro newyorkese come nessuno. Qui, un gruppo di persone si prepara per un pranzo elegante. La formula è quella dell’umanità più disparata messa a confronto: la diva gigiona, i nuovi ricchi, i giovani amanti, un capitano d’industria al collasso, un attore alcolista. Sullo sfondo, il crollo di Wall Street del 1929. Vince la gara Jean Harlow, che ha il segmento più brillante e la battuta…","g":"Commedia, Dramma","id":"pranzo-alle-otto"},{"t":"Il signore resta a pranzo","ot":"The Man Who Came to Dinner","y":1942,"rt":112,"d":"William Keighley","wd":"Q2307466","wp":"Il signore resta a pranzo","in":"Il signore resta a pranzo è un film del 1942 diretto da William Keighley.","al":["Il Signore Resta a Pranzo (The Man Who Came to Dinner)"],"l":"Inglese","s":"sott. ITA","lr":"originale con i sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/70413/standard_08aa51e3-16fa-45a1-91ba-08095bab09b0.png","o":"Sheridan Whiteside, star radiofonica, rimane intrappolato in una cittadina dell’Ohio sotto Natale. Costretto su una carrozzina, semina il panico nella famiglia che lo ospita. Ritratto di un umorista newyorkese, viziato e bisbetico, il film fu concepito per John Barrymore, che aveva problemi di salute. La Warner ripiegò su Monty Woolley, che aveva creato il personaggio a Broadway, ma gli affiancò Bette Davis, una leonessa contenuta, e Ann Sheridan, una leonessa smisu rata.…","g":"Commedia, Romance","id":"il-signore-resta-a-pranzo"},{"t":"Palcoscenico","ot":"Stage Door","y":1937,"rt":92,"d":"Gregory La Cava","wd":"Q1020603","wp":"Palcoscenico (film)","in":"Palcoscenico è un film del 1937 diretto da Gregory La Cava.","al":["Palcoscenico (Stage Door)"],"l":"Inglese","s":"sott. ITA","lr":"originale con i sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/70414/standard_eca921ec-144f-4b41-a682-ec3f237f6b9f.png","o":"“State ballando?” “No, abbiamo il delirium tremens” risponde Ginger Rogers al mellifluo di turno mentre sta provando. Aspiranti attrici e ballerine in una pensione per donne: è il poco che resta dell’originale di Kaufman e Ferber nella trasposizione di La Cava, maestro dell’improvvisazione (la sceneg giatura serve solo per essere ignorata). Un miracolo di commedia e dramma, una polifonia di voci: tra le più forti, Kate Hepburn, Gail Patrick e Lucille Ball oltre a Ginger.…","g":"Commedia, Dramma","id":"palcoscenico"},{"t":"La La Land","ot":"","y":2016,"rt":128,"d":"Damien Chazelle","wd":"Q20856802","wp":"La La Land","in":"La La Land è un film del 2016 scritto e diretto da Damien Chazelle.","l":"Inglese","s":"sott. ITA","lr":"originale con i sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/86912/standard_076bb738-3562-4405-b76d-5b60569ac620.png","o":"Los Angeles. Mia sogna di poter recitare ma intanto, mentre passa da un provino all'altro, serve caffè e cappuccini alle star. Sebastian è un musicista jazz che si guadagna da vivere suonando nei piano bar in cui nessuno si interessa a ciò che propone. I due si scontrano e si incontrano fino a quando nasce un rapporto che è cementato anche dalla comune volontà di realizzare i propri sogni e quindi dal sostegno reciproco. Il successo arriverà ma, insieme ad esso, gli ostacoli…","g":"Commedia, Dramma, Romance","id":"la-la-land"},{"t":"Wild Horse Nine","al":["Wilde Horse Nine"],"l":"Lingua originale","s":"sott. ITA","lr":"Originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/86714/standard_895fc0f1-3cfe-43ee-bacb-7269a250507e.jpg","o":"Cile, 1973. Chris e Lee sono due agenti della CIA distaccati in Sud America, costretti ad affrontare un complicato viaggio da Santiago all'Isola di Pasqua che metterà a dura prova la loro fiducia reciproca.","d":"Martin Mc Donagh","y":2026,"g":"Commedia, Thriller, Crime","id":"wild-horse-nine"},{"t":"Dune - Parte tre","ot":"Dune: Part Three","y":2026,"rt":0,"d":"Denis Villeneuve","wd":"Q124714245","wp":"Dune - Parte tre","in":"Dune - Parte tre è un film del 2026 co-sceneggiato, diretto e co-prodotto da Denis Villeneuve.","l":"Inglese","s":"sott. ITA","lr":"Originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/76353/standard_092f4619-5a81-45e1-9109-c91b7d34d950.jpg","o":"Dune – Parte Tre è ambientato quasi due decenni dopo che Paul Atreides ha preso il controllo dell’Impero. Ora un Imperatore spietato, Paul deve affrontare le conseguenze del suo regno mentre vecchi alleati fanno ritorno, terrificanti nuove minacce emergono e il tradimento si annida in ogni ombra. Tormentato dalle visioni del crollo dell’Impero e dalla ricomparsa del suo amore perduto da tempo, Paul viene trascinato in una vasta cospirazione, al cui centro si trova Chani e il…","g":"Fantascienza","id":"dune-parte-tre"},{"t":"Clayface","l":"Inglese","s":"sott. ITA","lr":"Inglese con sottotitoli in Italiano","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/97067/standard_8b22ef70-db17-4972-a837-5722a0edaae3.JPG","o":"Clayface\" unravels one man's horrifying descent from rising Hollywood star to revenge-filled monster in a story that explores the loss of one's identity and humanity, corrosive love, and the dark underbelly of scientific ambition.","d":"James Watkins","y":2026,"g":"Fantascienza, Horror, Thriller","id":"clayface"},{"t":"Matrix","ot":"The Matrix","y":1999,"rt":136,"d":"Lana Wachowski, Lilly Wachowski","wd":"Q83495","wp":"Matrix","in":"Matrix è un film di fantascienza del 1999 in stile cyberpunk scritto e diretto dagli allora fratelli Andy e Larry Wachowski, reduci dal successo di Bound.","l":"Inglese","s":"sott. ITA","lr":"Inglese con sottotitoli in Italiano","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/100136/standard_02394176-8f32-4331-bf4e-bf995bf36384.jpg","o":"Neo believes that Morpheus, an elusive figure considered to be the most dangerous man alive, can answer his question -- What is the Matrix? Neo is contacted by Trinity, a beautiful stranger who leads him into an underworld where he meets Morpheus. They fight a brutal battle for their lives against a cadre of viciously intelligent secret agents. It is a truth that could cost Neo something more precious than his life.","g":"Fantascienza, Azione","id":"matrix"},{"t":"Wild Horse Nine","ot":"","y":2026,"rt":0,"d":"Martin McDonagh","wd":"Q133341572","wp":"Wild Horse Nine","in":"Wild Horse Nine è un film del 2026 diretto, co-sceneggiato e co-prodotto da Martin McDonagh.","l":"Inglese","s":"sott. ITA","lr":"Inglese con sottotitoli in Italiano","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/99311/standard_3fc34df0-7777-4734-a6f3-01e3c8f87e97.jpg","o":"Shortly before the 1973 Chilean coup, CIA agents Chris (John Malkovich) and Lee (Sam Rockwell) are dispatched from Santiago to Easter island by their bureau chief, MJ (Steve Buscemi). Amongst the Island's iconic statues, and as the longtime partners wrestle with their dark pasts and present conspiracies, Chris's newfound bond with a pair of rebellious students (Mariana di Girolamo and Ailín Salas) threatens to send everyone’s trip to this remote paradise sideways.","g":"Commedia, Thriller","id":"wild-horse-nine-2026"},{"t":"Ozzy & Black Sabbath: Back to the Beginning","l":"Inglese","s":"sott. ITA","lr":"Inglese con sottotitoli in Italiano","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/99972/standard_a6f1a349-c913-4cdc-a35f-f36584784631.jpg","o":"Il più grande giorno nella storia dell'heavy metal. L'ultima volta di Ozzy: 17 giorni prima di morire, Il re del metal saluta il mondo. Ora quella notte arriva al cinema Sarà a ottobre l’uscita cinematografica mondiale di Ozzy & Black Sabbath: Back To The Beginning, prodotto da Mercury Studios, il principale studio al mondo specializzato in contenuti musicali. Il film cattura in modo definitivo l’ultima e trionfante esibizione dal vivo di Ozzy Osbourne con la formazione…","d":"Ben Wainwright Pearce","y":2026,"g":"Documentario, Musica","id":"ozzy-black-sabbath-back-to-the-beginning"},{"t":"Stray Kids World Tour \"Run It\" - Il Live Viewing","l":"Coreano","s":"sott. ENG","lr":"Coreano con sottotitoli in Inglese","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/97232/standard_1c23a10d-7e33-4a9d-811f-8122cd90fe5e.jpg","o":"Gli Stray Kids per la prima volta in diretta al cinema, un evento k-pop eccezionale in contemporanea nelle sale di tutto il mondo. Stray Kids World Tour “Run It”: Il Live Viewing, il monumentale world tour del fenomeno globale, arriva nei cinema di tutto il mondo con una speciale diretta dall’iconico Tokyo Dome sabato 7 novembre. I biglietti per l’evento saranno in vendita anche su StrayKidsLiveViewing.com da mercoledì 14 ottobre alle 16:00 ora italiana. I fan possono già…","d":"Jyp Entertainment","y":2026,"g":"Musicale","id":"stray-kids-world-tour-run-it-il-live-viewing"},{"t":"Dune - Parte Tre","al":["Dune: Part Three"],"l":"Inglese","s":"sott. ITA","lr":"Inglese con sottotitoli in Italiano","p":"https://cdn.18tickets.net/iris/uploads/film/playbill/87762/standard_1e81b353-2456-4df4-a9db-5b6622b33620.jpg","o":"Dune: Part Three is set nearly two decades after Paul Atreides seized control of the Imperium. Now a ruthless Emperor, Paul must face the consequences of his reign as old allies return, terrifying new threats emerge, and betrayal lurks in every shadow. Haunted by visions of Imperial collapse and the reappearance of his long-lost love, Paul is drawn into a sweeping conspiracy, with Chani at the heart of its unfolding mystery. As rebellion brews and enemies close in, Paul must…","d":"Denis Villeneuve","y":2026,"g":"Avventura, Fantascienza, Azione","id":"dune-parte-tre-2026"},{"t":"Il Dottor Stranamore","l":"Lingua originale","s":"sott. ITA","lr":"Originale con sottotitoli italiani","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/83117/standard_0f087f34-b587-49e6-88aa-3feb0f21bc8c.jpg","o":"Una delle black comedy più riuscite e celebrate sulla guerra nucleare torna in versione restaurata. Stanley Kubrick trasforma l’assurdità della minaccia atomica in un’irresistibile e dissacrante commedia sul potere, la follia e l’incapacità dell’uomo di controllare le conseguenze delle proprie azioni. Un generale americano, ossessionato dalla “minaccia comunista”, decide deliberatamente di ordinare un attacco nucleare contro l’Unione Sovietica...","d":"Stanley Kubrick","y":1964,"g":"Commedia","id":"il-dottor-stranamore"},{"t":"Essi vivono","ot":"They Live","y":1988,"rt":94,"d":"John Carpenter","wd":"Q72909","wp":"Essi vivono","in":"Essi vivono è un film del 1988 scritto e diretto da John Carpenter.","l":"Inglese","s":"sott. ITA","lr":"Originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/83183/standard_4cdd32c9-e92f-4f7c-ab10-4a5f0cbcc73b.jpg","o":"Un uomo trova per caso un paio di occhiali capaci di rivelare la vera natura della società in cui vive: dietro pubblicità e messaggi quotidiani si nasconde un sistema di controllo alieno. John Carpenter trasforma la fantascienza in una satira feroce del consumismo, della pubblicità e del potere economico. Un cult movie diventato negli anni una delle opere più politiche e riconoscibili del regista.","g":"Fantascienza, Thriller, Azione","id":"essi-vivono"},{"t":"Ombre","ot":"Shadows","y":1958,"rt":87,"d":"John Cassavetes","wd":"Q1535980","wp":"Ombre (film 1959)","in":"Ombre (Shadows) è un film del 1959 scritto e diretto da John Cassavetes.","al":["Ombre (Shadows)"],"l":"Inglese","s":"sott. ITA","lr":"Versione Originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/84041/standard_7da3b4d8-0a31-4e20-8de2-0e9a81328104.jpg","o":"Pilastro del cinema indipendente americano. Segue le vicende di tre fratelli afroamericani a New York (Hugh, Ben e Leila) e affronta temi come le relazioni interrazziali, le aspirazioni artistiche e le identità sociali nella New York degli anni '50, tra Beat generation e musiche jazz in sottofondo.","g":"Drammatico, Musicale","id":"ombre"},{"t":"M - Il mostro di Düsseldorf","ot":"M","y":1931,"rt":117,"d":"Fritz Lang","wd":"Q127021","wp":"M - Il mostro di Düsseldorf","in":"M - Il mostro di Düsseldorf è un film tedesco del 1931, diretto da Fritz Lang.","l":"Tedesco","s":"sott. ITA","lr":"Versione Originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/84008/standard_550a9e0e-0b9a-457a-9b6c-51feb0bf3aae.jpg","o":"Un criminale ammazza otto bambine. La città è nel panico, la gente sospetta chiunque, la polizia non ha un indizio su cui lavorare. La criminalità organizzata è in crisi: non può operare liberamente per via dei continui controlli e retate delle forze dell’ordine. Quando il mostro uccide un’altra bambina, le forze criminali decidono di dargli la caccia. E arrivano prima della polizia. “Ho cercato di avvicinarmi all’assassino con l’immaginazione, per mostrarlo come un uomo…","g":"Drammatico, Thriller, Crime","id":"m-il-mostro-di-dusseldorf"},{"t":"Taxi Driver","ot":"","y":1976,"rt":114,"d":"Martin Scorsese","wd":"Q47221","wp":"Taxi Driver","in":"Taxi Driver è un film del 1976 diretto da Martin Scorsese, scritto da Paul Schrader e interpretato da Robert De Niro.","l":"Inglese","s":"sott. ITA","lr":"Originale con i sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/76385/standard_52dd8c57-8b9a-426e-ad4a-dbd6fa14cf58.jpg","o":"De Niro fa il tassista di notte, mestiere adatto a chi è solo e soffre d’insonnia come lui. Conosce Cybill Shepherd e, giustamente, se ne innamora. Al primo appuntamento la porta a vedere un film porno. Lei scappa a gambe levate. Sempre più solo, si arma. Cerca di uccidere un uomo politico e fa cilecca, gli riesce invece una carneficina in un bordello di terz’ordine dove opera Jodie Foster, prostituta bambina. Diventa un eroe. Il capolavoro di Scorsese.","g":"Drammatico","id":"taxi-driver"},{"t":"Il Casanova di Federico Fellini","ot":"","y":1976,"rt":148,"d":"Federico Fellini","wd":"Q18429","wp":"Il Casanova di Federico Fellini","in":"Il Casanova di Federico Fellini è un film del 1976 diretto da Federico Fellini con Donald Sutherland, vincitore dell'Oscar ai migliori costumi.","l":"Lingua originale","s":"sott. ITA","lr":"Originale con i sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/86945/standard_9484ba93-9574-4fd6-be32-c9bebac24a7c.jpeg","o":"La vita di Casanova secondo Fellini: la nuova versione restaurata dal Centro Sperimentale di Cinematografia - Cineteca Nazionale. Giacomo Casanova, il celebre seduttore veneziano, viene rinchiuso nel carcere dei Piombi, dal quale riesce a evadere dopo una rocambolesca fuga. Uomo orgoglioso e con velleità letterarie, Casanova intraprende un viaggio in diverse città italiane e straniere, ma in ogni occasione deve fare i conti con la propria fama di grande amatore e con…","g":"Commedia, Grottesco, Storico","id":"il-casanova-di-federico-fellini"},{"t":"Dracula di Bram Stoker","ot":"Bram Stoker's Dracula","y":1992,"rt":128,"d":"Francis Ford Coppola","wd":"Q107325","wp":"Dracula di Bram Stoker","in":"Dracula di Bram Stoker è un film del 1992 diretto e co-prodotto da Francis Ford Coppola.","l":"Inglese","s":"sott. ITA","lr":"Originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/87671/standard_9d9803a7-4d6b-44df-8135-d3fb720384e7.jpg","o":"Francis Ford Coppola affronta il mito di Dracula tornando al romanzo di Bram Stoker e trasformandolo in una grande storia d’amore, ossessione e morte. Gary Oldman interpreta il conte Dracula in una delle versioni più romantiche e tormentate del personaggio, affiancato da Winona Ryder e Anthony Hopkins. Un film visionario e barocco, costruito attraverso effetti speciali volutamente artigianali, trucchi ottici e una straordinaria ricerca visiva.","g":"Horror","id":"dracula-di-bram-stoker"},{"t":"Volti","ot":"Faces","y":1968,"rt":130,"d":"John Cassavetes","wd":"Q2241601","wp":"Volti (film)","in":"Volti (Faces) è un film del 1968 scritto e diretto da John Cassavetes.","al":["Volti (Faces)"],"l":"Inglese","s":"sott. ITA","lr":"Originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/84173/standard_de43e73a-7019-491f-9927-bb360f7a399a.jpg","o":"Il racconto di una crisi di coppia, consumata su binari paralleli in una livida Los Angeles: lui, Richard Frost (John Marley) va con una prostituta (Gena Rowlands), si intrattiene con uomini d'affari, vuole a chiare lettere il divorzio; lei, Maria (Lynn Carlin), si concede un'evasione extraconiugale. Ma il reciproco tentativo di fuga non servirà a mettere fine ai loro problemi.","g":"Dramma","id":"volti"},{"t":"Un uomo da marciapiede","ot":"Midnight Cowboy","y":1969,"rt":108,"d":"John Schlesinger","wd":"Q61696","wp":"Un uomo da marciapiede","in":"Un uomo da marciapiede è un film del 1969 diretto da John Schlesinger e interpretato da Dustin Hoffman e Jon Voight, basato sull'omonimo romanzo del 1965 di James Leo Herlihy.","al":["Un Uomo da Marciapiede (Midnight Cowboy)"],"l":"Inglese","s":"sott. ITA","lr":"Originale con i sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/76418/standard_30377b7b-2f70-4c06-a660-a87a63be2b34.jpg","o":"In una Times Square squallida, molto prima che la Disney la sanificasse, Joe Buck, stallone di professione, e Ratso Rizzo, traffichino sfigato, sembrano i padroni della strada. Il primo cammina deciso, il secondo zoppica. L’inglese John Schlesinger racconta un mondo tetro con un realismo a tratti venato di humor nero. Quando uscì, fece scandalo per l’ambiguità sessuale: per la prima volta un film di una major parlava di due antieroi in un rapporto emotivo fuori da ogni…","g":"Dramma","id":"un-uomo-da-marciapiede"},{"t":"Gli esclusi","ot":"A Child Is Waiting","y":1963,"rt":104,"d":"John Cassavetes","wd":"Q1304726","wp":"Gli esclusi","in":"Gli esclusi è un film del 1963 diretto da John Cassavetes e prodotto da Stanley Kramer.","al":["Gli Esclusi (A Child Is Waiting)"],"l":"Inglese","s":"sott. ITA","lr":"Originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/84206/standard_5117b98f-be1a-47aa-bbab-d2c764e7d6b1.jpg","o":"Reuben Widdicombe è un bambino ritardato, lasciato da suo padre nell'istituto di recupero del dottor Clarke. Reuben è un introverso molto sensibile che si affeziona senza riserve a Jane Hansen, la nuova assistente. La donna, con le sue attenzioni esclusive e l'adozione di iniziative personali nei suoi confronti, rischia di pregiudicare irrimediabilmente la faticosa opera di recupero.","g":"Dramma","id":"gli-esclusi"},{"t":"Minnie e Moskowitz","ot":"Minnie and Moskowitz","y":1971,"rt":114,"d":"John Cassavetes","wd":"Q2395265","wp":"Minnie and Moskowitz","in":"Minnie and Moskowitz è un film del 1971 diretto da John Cassavetes.","al":["Minnie & Moskowitz (Minnie and Moskowitz)"],"l":"Inglese","s":"sott. ITA","lr":"Versione Originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/84272/standard_8ba559bb-bfe8-4e70-83f0-474f333f77f2.jpg","o":"Minnie e Moskowitz si incontrano, si scontrano, si sposano, forse sono anche felici. È in questo film che Gena Rowlands sintetizza la filosofia del cinema di Cassavetes: “Il cinema è un complotto. I film ti incastrano, fin da quando sei bambino. Ti fanno credere a tutto: gli ideali, la forza, e i bravi ragazzi, i sentimenti e poi l’amore. Così inizi a cercare, ma non suc cede, e continui a cercare… Io non ho mai incontrato Charles Boyer, non ho mai incontrato Clark Gable…I…","g":"Commedia, Dramma, Romance","id":"minnie-e-moskowitz"},{"t":"Serpico","ot":"","y":1973,"rt":130,"d":"Sidney Lumet","wd":"Q657079","wp":"Serpico","in":"Serpico è un film del 1973 diretto da Sidney Lumet e interpretato da Al Pacino.","l":"Inglese","s":"sott. ITA","lr":"Originale con i sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/76419/standard_bd8a8fd2-51dc-4f80-89c6-2afb62627290.jpg","o":"Ci voleva un italiano per mettere in scena un personaggio newyorchese di origini italiane che non fosse un mafioso. Il film fu progettato da Dino De Laurentiis e iniziato da John G. Avildsen, che litigò con la produzione e abbandonò il set. Finì nelle mani di Sidney Lumet e oggi è un classico. Il poliziotto Frank Serpico si veste come un hippie, frequenta una ragazza evoluta, ha un cane bobtail, non accetta mazzette. Frank Serpico è l’antipoliziotto: si ficca nei guai perché…","g":"Dramma, Crime, Storia","id":"serpico"},{"t":"Mariti","ot":"Husbands","y":1970,"rt":138,"d":"John Cassavetes","wd":"Q2721763","wp":"Mariti (film)","in":"Mariti (Husbands) è un film del 1970 diretto da John Cassavetes.","al":["Mariti (Husbands)"],"l":"Inglese","s":"sott. ITA","lr":"Originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/84305/standard_9ecaa616-e8ce-4329-aac2-adb9270071c7.jpg","o":"Tre quarantenni - Archie, Gus e Harry - si ritrovano per una triste evenienza (il funerale di un carissimo amico comune), ma poi approfittano dell'occasione per far festa per le strade e i locali di New York, abbandonando moglie e figli per un paio di giorni nel tentativo di dimenticare le angosce e le miserie della vita quotidiana. Se ne andranno addirittura a Londra, ma solo uno di loro deciderà di restarci...","g":"Commedia, Dramma","id":"mariti"},{"t":"Il braccio violento della legge","ot":"The French Connection","y":1971,"rt":104,"d":"William Friedkin","wd":"Q220735","wp":"Il braccio violento della legge","in":"Il braccio violento della legge è un film del 1971 diretto da William Friedkin, e interpretato da Gene Hackman, Roy Scheider e Fernando Rey.","l":"Inglese","s":"sott. ITA","lr":"Originale con i sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/76451/standard_57a1d209-a1f0-4c46-8dfc-ce116b276d36.jpg","o":"Popeye Doyle e Cloudy Russo, due poliziotti di New York, cercano di incastrare “French Connection”, un criminale arrivato da Marsiglia con il compito di contrabbandare un carico di eroina da trentadue milioni di dollari. Una caccia all’uomo senza tregua, famosa per lo spericolato inseguimento sotto la soprelevata della metropolitana. Fu un successo a sorpresa, vinse cinque Oscar e catapultò il giovane Friedkin tra i registi più richiesti. Non ci sono parole giuste per la…","g":"Poliziesco","id":"il-braccio-violento-della-legge"},{"t":"Una Moglie","l":"Lingua originale","s":"sott. ITA","lr":"Versione Originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/84338/standard_6d40deb7-95de-4c3e-9106-a72dca723a31.jpg","o":"Mabel, sposata all'italoamericano Nick, con tre figli, sente crescere il conflitto con la realtà che la circonda soprattutto nei rapporti con il marito il cui lavoro lo tiene spesso lontano da casa e che gli impone ritmi tali da renderlo a sua volta spesso nervoso e intrattabile. Dopo l'ennesimo litigio, Mabel subisce un crollo nervoso in seguito al quale deve trascorrere un periodo in clinica.","d":"John Cassavetes","y":1974,"g":"Dramma, Romance","id":"una-moglie"},{"t":"Mikey e Nicky","ot":"Mikey and Nicky","y":1976,"rt":106,"d":"Elaine May","wd":"Q3313626","wp":"Mikey e Nicky","in":"Mikey e Nicky è un film statunitense del 1976, diretto e scritto da Elaine May.","l":"Inglese","s":"sott. ITA","lr":"Originale con sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/84965/standard_7243b5c0-4f5b-4524-bac2-0c418dd537f5.jpeg","o":"Nicky ha rubato alla mafia e si nasconde in un albergaccio. Chiama in soccorso Mikey, amico da sempre. Liberare Nicky dai guai non è facile e forse il piano di Mikey non è proprio aiutarlo. Girato in esterni a Filadelfia e ambientato tutto in una notte. Elaine May segue la coppia con tre macchine da presa tra bar, locali notturni e strade bagnate. Duro e realistico, con dialoghi fittissimi, il film scava nelle vite dei due proprio come un film di Cassavetes. E, come…","g":"Dramma, Crime","id":"mikey-e-nicky"},{"t":"Codice penale","ot":"The Criminal Code","y":1930,"rt":97,"d":"Howard Hawks","wd":"Q1129567","wp":"Codice penale (film)","in":"Codice penale è un film del 1930 diretto da Howard Hawks.","al":["Codice Penale (The Criminal Code)"],"l":"Inglese","s":"sott. ITA","lr":"originale con i sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/70445/standard_98bf050b-799a-4930-9742-a4f39db706d8.png","o":"Esemplare raro di perfetta regia cinematografica del primo sonoro. Ambientato per lo più in un penitenziario, racconta di un direttore di carcere progressista e alcuni detenuti. Tra questi, un “bravo ragazzo” finito dentro per omicidio involontario. Hawks si districa magistralmente nella gabbia dei dialoghi con un uso sapiente di illuminazione, dei tagli di montaggio e della mobilità (impercettibile) della macchina da presa. Uno dei carcerati è Boris Karloff, prima che…","g":"Dramma, Crime","id":"codice-penale"},{"t":"Ventesimo secolo","ot":"Twentieth Century","y":1934,"rt":91,"d":"Howard Hawks","wd":"Q1788051","wp":"Ventesimo secolo (film 1934)","in":"Ventesimo secolo è un film di Howard Hawks del 1934, interpretato da un mostro sacro del teatro come John Barrymore nel ruolo di un impresario di Broadway, geniale ma senza scrupoli, e da una delle più brillanti attrici della commedia Usa, Carole Lombard.","al":["Ventesimo Secolo (Twentieth Century)"],"l":"Inglese","s":"sott. ITA","lr":"originale con i sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/70478/standard_4d9fa4c0-12bb-4fa4-a062-9663b4b968da.png","o":"A bordo del Twentieth Century, un impresario di Broadway, in declino per i suoi eccessi, prova ogni stratagemma per riconquistare la sua ex pupilla, ex amante, ora diva di temperamento e di successo a Hollywood. Segue una battaglia di ego senza uguali nella storia del cinema. Con Hawks l’etica della commedia è nella risata, non c’è un messaggio che rimetta in pace con la coscienza. La felicità non ha bisogno di alibi. Barrymore e Lombard “larger than life” inventano la…","g":"Commedia, Romance","id":"ventesimo-secolo"},{"t":"Ritorno alla vita","ot":"Counsellor at Law","y":1933,"rt":82,"d":"William Wyler","wd":"Q2675288","wp":"Ritorno alla vita (film 1933)","in":"Ritorno alla vita è un film del 1933 diretto da William Wyler.","al":["Ritorno alla Vita (Counsellor at Law)"],"l":"Inglese","s":"sott. ITA","lr":"originale con i sottotitoli in italiano","p":"https://cdn.18tickets.net/ccroma/uploads/film/playbill/70577/standard_61766f2e-1d4e-4d1d-b192-944781c77e2e.png","o":"La commedia scritta da Elmer Rice e ambientata interamente in un ufficio legale. C’è un grande avvocato, i clienti ricchi, una segretaria devota, una moglie fedifraga, una madre che tradisce le origini umili del grande avvocato. È il primo film in cui William Wyler può rivelare la sua grandezza di metteur en scène: divide l’ufficio in più stanze per dare un senso di movimento ai dialoghi, intreccia le storie come in un grande albergo, le monta in modo dinamico. Ha a…","g":"Dramma","id":"ritorno-alla-vita"}],"shows":[[8,0,29875050,"Scorsese","Cinenido","","lumiere.cinetecabologna.18tickets.it/film/80040/916c39d0-4c27-4add-85ba-716f7ff89202"],[8,1,29875065,"Mastroianni PRIMA VISIONE","Anteprima P.v.","","lumiere.cinetecabologna.18tickets.it/film/92249/eb8efe17-0d4d-42b5-9ce0-b3da9c6289c6"],[10,3,29875065,"Cervi PRIMA VISIONE","Cinenido","","cervi.cinetecabologna.18tickets.it/film/98321/72b0426d-feb0-   let toks = qt.filter(t => { if (qt.length > 1 && CITY_ALIAS[t] && !city) { city = CITY_ALIAS[t]; return false; } return true; });
  const meaningful = toks.filter(t => !STOP.has(t));
  if (meaningful.length) toks = meaningful;
  if (!toks.length && city) toks = [norm(city)];
  const out = [];
  for (const e of IDX) {
    if (city && e.type === "city") continue;
    if (city && e.type === "cinema" && e.city !== city) continue;
    if (city && e.type === "film" && !e.cities.has(city)) continue;
    let sum = 0, ok = true;
    for (const t of toks) { const s = tokScore(t, e.words); if (!s) { ok = false; break; } sum += s; }
    if (!ok) continue;
    out.push({ e, score: sum / toks.length + e.w });
  }
  out.sort((a, b) => b.score - a.score);
  const groups = { city: [], cinema: [], film: [] };
  const lim = { city: 3, cinema: 5, film: 7 };
  for (const r of out) if (groups[r.e.type].length < lim[r.e.type]) groups[r.e.type].push(r);
  const order = Object.keys(groups).filter(k => groups[k].length).sort((a, b) => groups[b][0].score - groups[a][0].score);
  return { city, toks, order, groups };
}

function highlight(label, toks) {
  let html = esc(label);
  const n = [...label].map(ch => (ch.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, " ") || " ")[0]).join("");
  if (n.length !== label.length) return html;
  const marks = [];
  toks.forEach(t => { const re = new RegExp("(^|[^a-z0-9])(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "g"); let m; while ((m = re.exec(n))) marks.push([m.index + m[1].length, m.index + m[1].length + t.length]); });
  if (!marks.length) return html;
  marks.sort((a, b) => a[0] - b[0]);
  let res = "", pos = 0;
  for (const [a, b] of marks) { if (a < pos) continue; res += esc(label.slice(pos, a)) + "<mark>" + esc(label.slice(a, b)) + "</mark>"; pos = b; }
  return res + esc(label.slice(pos));
}

const form = document.getElementById("search"), qEl = document.getElementById("q"), resEl = document.getElementById("results");
let opts = [], active = -1;
const ICON = { city: "C", cinema: "S", film: "F" };
const GRP = { city: "Città", cinema: "Cinema", film: "Film" };

function suggestions() {
  const cities = IDX.filter(e => e.type === "city").map(e => ({ e }));
  const films = IDX.filter(e => e.type === "film").sort((a, b) => b.n.length - a.n.length).slice(0, 4).map(e => ({ e }));
  return { city: null, toks: [], order: ["city", "film"], groups: { city: cities, film: films, cinema: [] }, suggest: true };
}
function renderResults() {
  const v = qEl.value;
  const r = v.trim() ? search(v) : suggestions();
  opts = []; active = -1;
  let html = "";
  if (r.city) html += `<div class="hint">Risultati a <b>${esc(r.city)}</b></div>`;
  if (!r.order.length) html += `<div class="empty">Nessun risultato per “${esc(v.trim())}”. Prova con il titolo originale o italiano, un cinema o una città.</div>`;
  for (const k of r.order) {
    html += `<div class="grp eyebrow">${r.suggest && k === "film" ? "Più programmati" : GRP[k]}</div>`;
    for (const { e } of r.groups[k]) {
      const href = e.type === "film" ? "#f-" + FILM[e.fi].id + (r.city ? "~" + citySlug(r.city) : "") : e.href;
      const sub = e.type === "film" ? filmSub(e, r.city) : e.sub;
      const i = opts.length; opts.push(href);
      html += `<a class="opt" role="option" id="opt${i}" href="${href}" aria-selected="false">${e.type === "film" && FILM[e.fi].p ? `<img class="ic" src="${esc(FILM[e.fi].p)}" alt="" loading="lazy" data-ph="F">` : `<span class="ic" aria-hidden="true">${ICON[e.type]}</span>`}<span class="tx"><span class="lb">${highlight(e.label, r.toks)}</span><span class="sb">${esc(sub)}</span></span></a>`;
    }
  }
  resEl.innerHTML = html;
  resEl.hidden = false; qEl.setAttribute("aria-expanded", "true");
}
function closeResults() { resEl.hidden = true; qEl.setAttribute("aria-expanded", "false"); qEl.removeAttribute("aria-activedescendant"); }
function setActive(i) {
  if (!opts.length) return;
  active = (i + opts.length) % opts.length;
  resEl.querySelectorAll(".opt").forEach((o, j) => o.setAttribute("aria-selected", j === active ? "true" : "false"));
  const el = document.getElementById("opt" + active); el.scrollIntoView({ block: "nearest" });
  qEl.setAttribute("aria-activedescendant", "opt" + active);
}
qEl.addEventListener("input", renderResults);
qEl.addEventListener("focus", renderResults);
qEl.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); if (resEl.hidden) renderResults(); setActive(active + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setActive(active - 1); }
  else if (e.key === "Escape") { closeResults(); }
});
form.addEventListener("submit", e => { e.preventDefault(); const href = opts[active >= 0 ? active : 0]; if (href) go(href); });
resEl.addEventListener("mousedown", e => e.preventDefault());
resEl.addEventListener("click", e => { const a = e.target.closest("a.opt"); if (a) { e.preventDefault(); go(a.getAttribute("href")); } });
qEl.addEventListener("blur", () => setTimeout(closeResults, 120));
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== qEl && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); qEl.focus(); } });
function go(href) { closeResults(); qEl.value = ""; qEl.blur(); if (location.hash === href) route(); else location.hash = href; }

const view = document.getElementById("view");
const crumbs = items => `<nav class="crumbs" aria-label="Percorso">${items.map((it, i) => (i ? '<span aria-hidden="true">›</span>' : "") + (it[1] ? `<a href="${it[1]}">${esc(it[0])}</a>` : `<span>${esc(it[0])}</span>`)).join("")}</nav>`;

function nextList(shows, limit, withCity) {

function viewHome() {
  const cityCards = CITY_NAMES.map(c => {
    const sh = showsOfCity(c); if (!sh.length) return "";
    const cins = new Set(sh.map(s => s.c)), films = new Set(sh.map(s => s.f));
    const today = sh.filter(s => dayKey(s.t) === TODAY).length;
    return `<a class="city" href="#c-${citySlug(c)}"><h3>${esc(c)}</h3><span class="n"><b>${films.size}</b> film · <b>${cins.size}</b> cinema</span><span class="n">${today ? `<b>${today}</b> spettacoli oggi` : `${sh.length} spettacoli in programma`}</span></a>`;
  }).join("");
  const byFilm = [...groupBy(SH, s => s.f)].map(([f, sh]) => ({ f, sh, cins: new Set(sh.map(s => s.c)).size })).sort((a, b) => b.cins - a.cins || b.sh.length - a.sh.length).slice(0, 8);
  const today = SH.filter(s => dayKey(s.t) === TODAY);
  const upcoming = today.length >= 6 ? today : SH;
  return `
  <section aria-labelledby="h-cities"><h2 id="h-cities">Città</h2>
    <div class="cities">${cityCards}</div></section>
  <section aria-labelledby="h-next"><h2 id="h-next">${today.length >= 6 ? "Stasera in VO" : "Prossimi spettacoli"}</h2>
    <p class="lede">I prossimi spettacoli in versione originale in tutte le città.</p>
    ${nextList(upcoming, 12, true)}</section>
  <section aria-labelledby="h-top"><h2 id="h-top">I più programmati</h2>
    <div class="list">${byFilm.map(({ f, sh, cins }) => { const F = FILM[f]; const cities = [...new Set(sh.map(s => CIN[s.c].c))]; return `<div class="row"><div class="t thumbed">${thumb(F)}<div class="tt"><h3><a href="#f-${F.id}">${esc(F.t)}</a></h3><span class="lang">${esc(subs(F))}</span></div></div><div class="side"><b>${plural(cins, "cinema", "cinema")}</b><br>${esc(cities.join(", "))}</div></div>`; }).join("")}</div></section>`;
}

function viewCity(city) {
  const sh = showsOfCity(city);
  const byCin = [...groupBy(sh, s => s.c)].sort((a, b) => b[1].length - a[1].length);
  const films = [...groupBy(sh, s => s.f)].sort((a, b) => FILM[a[0]].t.localeCompare(FILM[b[0]].t, "it"));
  const quiet = CIN.filter((c, i) => c.c === city && !byCin.some(([ci]) => ci === i));
  const missing = (D.missing || {})[city] || [];
  return `
  <div class="head">${crumbs([["Home", "#"], [city]])}
    <h1>${esc(city)}</h1>
    <div class="facts"><span><b>${byCin.length}</b> cinema con film in VO</span><span><b>${films.length}</b> film</span><span><b>${sh.length}</b> spettacoli</span></div></div>
  <section aria-labelledby="h-cin"><h2 id="h-cin">Cinema</h2>
    <div class="list">${byCin.map(([ci, list]) => { const c = CIN[ci]; const fs = [...new Set(list.map(s => s.f))]; const todayN = list.filter(s => dayKey(s.t) === TODAY).length;
      return `<div class="row"><div class="t"><h3><a href="#s-${c.id}">${esc(c.n)}</a></h3><span class="sm">${esc([c.a, c.z].filter(Boolean).join(" · "))}</span>
        <span class="films-inline">${fs.slice(0, 5).map(f => `<a href="#f-${FILM[f].id}~${citySlug(city)}">${esc(FILM[f].t)}</a>`).join(", ")}${fs.length > 5 ? ` e altri ${fs.length - 5}` : ""}</span></div>
        <div class="side"><b>${plural(fs.length, "film", "film")}</b><br>prossimo ${esc(whenShort(list[0].t))}${todayN ? `<br>${todayN} oggi` : ""}</div></div>`; }).join("")}</div>
    ${quiet.length || missing.length ? `<p class="note">${quiet.length ? `<b>Nessun film in VO al momento:</b> ${quiet.map(c => esc(c.n)).join(", ")}. ` : ""}${missing.length ? `<b>Non ancora coperti:</b> ${missing.map(esc).join(", ")}.` : ""}</p>` : ""}</section>
  <section aria-labelledby="h-films"><h2 id="h-films">Film in VO a ${esc(city)}</h2>
    <div class="list">${films.map(([f, list]) => { const F = FILM[f]; const cins = [...new Set(list.map(s => s.c))];
      return `<div class="row"><div class="t thumbed">${thumb(F)}<div class="tt"><h3><a href="#f-${F.id}~${citySlug(city)}">${esc(F.t)}</a></h3><span class="lang">${esc(subs(F))}</span><span class="sm">${cins.map(c => esc(CIN[c].n)).join(", ")}</span></div></div><div class="side">prossimo<br><b>${esc(whenShort(list[0].t))}</b></div></div>`; }).join("")}</div></section>`;
}

let cinDay = null;
function viewCinema(ci) {
  const c = CIN[ci];
  const sh = SH.filter(s => s.c === ci);
  const days = [...groupBy(sh, s => dayKey(s.t))];
  if (cinDay === null || (cinDay !== "all" && !days.some(([k]) => k === cinDay))) cinDay = days.length ? days[0][0] : "all";
  const filmsN = new Set(sh.map(s => s.f)).size;
  const dayBtns = `<div class="days" role="group" aria-label="Scegli il giorno">${days.map(([k, l]) => `<button type="button" class="day" data-day="${k}" aria-pressed="${k === cinDay}">${dayLabel(l[0].t)} <small>${dayDate(l[0].t)} · ${l.length}</small></button>`).join("")}${days.length > 1 ? `<button type="button" class="day" data-day="all" aria-pressed="${cinDay === "all"}">Tutti <small>${days.length} giorni</small></button>` : ""}</div>`;
  const block = list => [...groupBy(list, s => s.f)].map(([f, l]) => { const F = FILM[f]; const labs = [...new Set(l.map(s => s.lab).filter(Boolean))];
    return `<div class="row"><div class="t thumbed">${thumb(F)}<div class="tt"><h3><a href="#f-${F.id}">${esc(F.t)}</a> ${labs.map(x => `<span class="badge">${esc(x)}</span>`).join(" ")}</h3><span class="lang">${esc(subs(F))}</span></div></div><div class="times">${l.map(tixHtml).join("")}</div></div>`; }).join("");
  const body = cinDay === "all"
    ? days.map(([k, l]) => `<h3 class="city-h" style="font-size:22px">${dayLabel(l[0].t)} <small>${dayDate(l[0].t)}</small></h3><div class="list">${block(l)}</div>`).join("")
    : `<div class="list">${block((days.find(([k]) => k === cinDay) || [, []])[1])}</div>`;
  return `
  <div class="head">${crumbs([["Home", "#"], [c.c, "#c-" + citySlug(c.c)], [c.n]])}
    <h1>${esc(c.n)}</h1>
    <div class="facts">${c.a ? `<span>${esc(c.a)}${c.z ? ", " + esc(c.z) : ""}</span>` : ""}<span><b>${filmsN}</b> film in VO</span><span><b>${sh.length}</b> spettacoli</span></div>
    <div class="actions">${c.w ? `<a class="btn" href="${esc(c.w)}" target="_blank" rel="noopener">Sito del cinema ↗</a>` : ""}<a class="btn" href="${mapsUrl(c)}" target="_blank" rel="noopener">Indicazioni ↗</a></div></div>
  <section aria-labelledby="h-prog"><h2 id="h-prog">Programmazione in VO</h2>
    ${sh.length ? `${dayBtns}<p class="howto">Tocca un orario per prenotare sul sito del cinema.</p>${body}` : `<p class="note">Al momento questo cinema non ha spettacoli in versione originale in programma. Controlliamo ogni notte.</p>`}</section>`;
}

let filmCity = null;
function viewFilm(fi, citySl) {
  const F = FILM[fi];
  const sh = SH.filter(s => s.f === fi);
  const cities = [...groupBy(sh, s => CIN[s.c].c)];
  let city = citySl ? cityBySlug(citySl) : null;
  if (city && !cities.some(([c]) => c === city)) city = null;
  const shown = city ? cities.filter(([c]) => c === city) : cities;
  const cinN = new Set(sh.map(s => s.c)).size;
  const filt = cities.length > 1 ? `<div class="filters" role="group" aria-label="Filtra per città"><a class="day" href="#f-${F.id}" aria-pressed="${!city}">Tutte <small>${sh.length}</small></a>${cities.map(([c, l]) => `<a class="day" href="#f-${F.id}~${citySlug(c)}" aria-pressed="${c === city}">${esc(c)} <small>${l.length}</small></a>`).join("")}</div>` : "";
  return `
  <div class="head">${crumbs([["Home", "#"], ...(city ? [[city, "#c-" + citySlug(city)]] : []), [F.t]])}
    <div class="film-head" style="${F.p ? "" : "grid-template-columns:minmax(0,1fr)"}">${F.p ? `<img class="poster" src="${esc(F.p)}" alt="Locandina di ${esc(F.t)}" width="200" height="300">` : ""}
      <div class="fh-text"><h1>${esc(F.t)}</h1>
        ${F.ot || F.y || F.d ? `<div class="orig">${[F.ot ? `Titolo originale: <i>${esc(F.ot)}</i>` : "", F.d ? `Regia di <i>${esc(F.d)}</i>` : "", F.y || "", F.rt ? F.rt + " min" : "", F.g ? esc(F.g) : ""].filter(Boolean).join(" · ")}</div>` : ""}
        <div class="facts"><span><span class="badge vo">VO</span> <b>${esc(F.l)}</b>${F.s ? " · " + esc(F.s) : ""}</span><span>in <b>${plural(cinN, "cinema", "cinema")}</b></span><span><b>${sh.length}</b> spettacoli</span></div>
        ${F.o ? `<p class="plot">${esc(F.o)}</p>` : F.in ? `<p class="plot">${esc(F.in)} <span class="lang">(da Wikipedia)</span></p>` : ""}
        ${F.wp ? `<div class="actions"><a class="btn" href="https://it.wikipedia.org/wiki/${encodeURIComponent(F.wp.replace(/ /g, "_"))}" target="_blank" rel="noopener">Wikipedia ↗</a></div>` : ""}
      </div></div></div>
  <section aria-labelledby="h-where"><h2 id="h-where">Dove e quando</h2>
    ${filt}
    ${sh.length ? `<p class="howto">Tocca un orario per prenotare sul sito del cinema.</p>` : `<p class="note">Nessuno spettacolo in programma.</p>`}
    ${shown.map(([c, l]) => `<div><h3 class="city-h">${esc(c)} <small>${plural(new Set(l.map(s => s.c)).size, "cinema", "cinema")}</small></h3>
      ${[...groupBy(l, s => s.c)].map(([ci, cl]) => { const C = CIN[ci]; return `<div class="cin-block"><h3><a href="#s-${C.id}">${esc(C.n)}</a> <span class="lang">${esc(C.z || "")}</span></h3>
        <div class="daygrid">${[...groupBy(cl, s => dayKey(s.t))].map(([k, dl]) => `<div class="dl">${dayLabel(dl[0].t)}<small>${dayDate(dl[0].t)}</small></div><div class="times">${dl.map(tixHtml).join("")}</div>`).join("")}</div></div>`; }).join("")}</div>`).join("")}</section>`;
}

function viewNotFound() {
  return `<div class="head">${crumbs([["Home", "#"]])}<h1>Pagina non trovata</h1><p class="note">Questo indirizzo non corrisponde a nessun film, cinema o città. Usa la ricerca qui sopra.</p></div>`;
}

const topEl = document.getElementById("top"), hero = document.getElementById("hero");
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  let html, title = "Film OV", isHome = false, ci;
  if (!h) { html = viewHome(); isHome = true; }
  else if (h.startsWith("c-") && cityBySlug(h.slice(2))) { const c = cityBySlug(h.slice(2)); html = viewCity(c); title = `Film in VO a ${c} · Film OV`; }
  else if (h.startsWith("s-") && (ci = cinById(h.slice(2))) >= 0) { if (route.lastCin !== ci) cinDay = null; route.lastCin = ci; html = viewCinema(ci); title = `${CIN[ci].n} · Film OV`; }
  else if (h.startsWith("f-")) { const [id, cs] = h.slice(2).split("~"); const fi = filmById(id); if (fi >= 0) { html = viewFilm(fi, cs); title = `${FILM[fi].t} in VO · Film OV`; } else html = viewNotFound(); }
  else html = viewNotFound();
  topEl.classList.toggle("home", isHome);
  hero.hidden = !isHome;
  (isHome ? document.getElementById("slotHero") : document.getElementById("slotBar")).appendChild(form);
  view.innerHTML = html;
  document.title = title;
  if (!route.keepScroll) window.scrollTo(0, 0);
  route.keepScroll = false;
}
view.addEventListener("click", e => {
  const b = e.target.closest("button.day[data-day]");
  if (!b) return;
  cinDay = b.dataset.day; route.keepScroll = true; route();
});
window.addEventListener("hashchange", route);
