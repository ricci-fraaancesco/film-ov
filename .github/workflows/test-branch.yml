name: Prova su un branch

# Runs the whole pipeline on a wip/ branch without publishing the site.
# Results (data/ and preview/index.html) are committed back to the branch for review.
on:
  push:
    branches: ["wip/**"]
    paths-ignore: ["data/**", "preview/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: |
          (cd scraper && python -m pytest -q)
          (cd site && python -m pytest -q)

      - name: Probe white-label Webtic numbers (temporary, this branch only)
        run: |
          cd scraper && python - <<'PY' | tee ../data/webtic_probe.txt
          import requests, webtic
          s = requests.Session(); s.headers["User-Agent"] = "FilmOV-bot/0.1 (+https://github.com/ricci-fraaancesco/film-ov)"
          def get_json(u, params=None):
              r = s.get(u, params=params, timeout=30); r.raise_for_status(); return r.json()
          ids = {"5283": "roma-savoy (mycityplex sc)", "5285": "roma-doria (mycityplex sc)", "5279": "roma-trianon (mycityplex sc)",
                 "5859": "roma-starplex-roma (thescreen sc)", "5779": "milano-notorious-merlata (notorious sc)",
                 "5048": "firenze-multisala-fiamma (staseraalcinema mult)", "5051": "firenze-multisala-marconi (staseraalcinema mult)",
                 "5858": "torino-cinema-agnelli (loadLocal)", "5650": "varese-filmstudio-90 (loadLocal)"}
          for lid, who in ids.items():
              try:
                  shows, pages, local = webtic.read_cinema(get_json, lid)
                  print(f"{lid}\t{who}\t=> {local.get('Description')} | {local.get('Town')} | {local.get('DistrictAbbreviation')}\t{len(shows)} shows, {sum(x.is_ov for x in shows)} OV")
              except Exception as e:
                  print(f"{lid}\t{who}\tERROR {e!r}"[:200])
          PY

      - name: Read the cinema pages
        run: python scraper/ov18tickets.py live --out data

      - name: Match films on Wikidata
        run: python site/wikidata_match.py --csv data/ov_showtimes.csv --data data

      - name: Build a preview
        run: python site/build_data.py --csv data/ov_showtimes.csv --data data --out preview

      - name: Save results on the branch
        run: |
          git config user.name "film-ov-bot"
          git config user.email "film-ov-bot@users.noreply.github.com"
          git add -f data preview
          git commit -m "Prova: dati e anteprima del $(date -u +%Y-%m-%d)" || echo "No changes"
          git push
