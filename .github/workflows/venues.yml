name: Lista dei cinema

# Rebuilds data/venues.csv from the public lists and OpenStreetMap.
# Runs when the list code changes, on the 1st of each month, or by hand.
on:
  push:
    branches: [main]
    paths: ["venues/**", ".github/workflows/venues.yml"]
  schedule:
    - cron: "41 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: venues
  cancel-in-progress: false

jobs:
  build-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: cd venues && python -m pytest -q

      - name: Build the list
        run: python venues/build_list.py --out data/venues.csv

      - name: Save the list (rebuilt again on the newest list if another job saved in between)
        if: always()
        run: |
          git config user.name "film-ov-bot"
          git config user.email "film-ov-bot@users.noreply.github.com"
          for attempt in 1 2 3; do
            git add data/venues_stats.json
            [ -f data/venues.csv ] && git add data/venues.csv
            [ -f data/osm_towns.json ] && git add data/osm_towns.json
            git commit -q -m "Lista cinema del $(date -u +%Y-%m-%d)" || { echo "No changes"; exit 0; }
            git push -q && exit 0
            echo "Someone saved in between, rebuilding on the newest list ($attempt)"
            cp data/osm_towns.json /tmp/osm_towns.json 2>/dev/null || true
            git fetch -q origin main && git reset -q --hard origin/main
            cp /tmp/osm_towns.json data/osm_towns.json 2>/dev/null || true
            python venues/build_list.py --out data/venues.csv
          done
          exit 1
