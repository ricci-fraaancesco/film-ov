name: Controllo siti dei cinema

# Checks the next batch of cinemas in data/venues.csv: website, ticketing platform,
# and a test read of 18tickets storefronts (those become 'active' for the nightly scrape).
on:
  schedule:
    - cron: "17 1 * * *"     # every night, before the showtimes update
  push:
    branches: [main]
    paths: ["venues/discover.py", ".github/workflows/discovery.yml"]
  workflow_dispatch:
    inputs:
      batch:
        description: "How many cinemas to check"
        default: "150"

permissions:
  contents: write

concurrency:
  group: venues
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: cd venues && python -m pytest -q

      - name: Check the next cinemas
        run: python venues/discover.py --venues data/venues.csv --batch ${{ github.event.inputs.batch || '150' }}

      - name: Save the results
        if: always()
        run: |
          git config user.name "film-ov-bot"
          git config user.email "film-ov-bot@users.noreply.github.com"
          git add data/venues.csv
          [ -f data/discovery_report.md ] && git add data/discovery_report.md
          git commit -m "Controllo siti cinema del $(date -u +%Y-%m-%d)" || echo "No changes"
          git pull --rebase -q && git push
