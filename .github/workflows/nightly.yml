name: Aggiornamento notturno

on:
  workflow_run:             # every night, right after the website check of the cinemas
    workflows: ["Controllo siti dei cinema"]
    types: [completed]
  workflow_dispatch:        # lets you start it by hand from the Actions tab
  push:                     # publish right away when the code or the design changes
    branches: [main]
    paths: ["site/**", "scraper/**", "requirements.txt", ".github/workflows/nightly.yml"]

permissions:
  contents: write   # save the new data in the repo
  issues: write     # open an issue when something looks wrong
  pages: write      # publish the website
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Test the parser and the film matcher
        run: |
          (cd scraper && python -m pytest -q)
          (cd site && python -m pytest -q)

      - name: Read the cinema pages
        run: python scraper/ov18tickets.py live --out data --venues data/venues.csv

      - name: Safety check (do not publish an empty site)
        run: |
          n=$(python -c "import json;print(json.load(open('data/run_stats.json'))['ov_shows'])")
          echo "OV shows found: $n"
          if [ "$n" -lt 50 ]; then echo "Too few shows, keeping yesterday's site."; exit 1; fi

      - name: Match films on Wikidata
        run: python site/wikidata_match.py --csv data/ov_showtimes.csv --data data

      - name: Restore the poster cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/posters
          key: posters-${{ github.run_id }}
          restore-keys: posters-

      - name: Build the website (posters are copied here, each downloaded from the cinema only once)
        run: python site/build_data.py --csv data/ov_showtimes.csv --data data --out public --base /film-ov/ --poster-cache .cache/posters

      - name: Save the poster cache
        uses: actions/cache/save@v4
        with:
          path: .cache/posters
          key: posters-${{ github.run_id }}

      - name: Save the new data in the repo
        run: |
          git config user.name "film-ov-bot"
          git config user.email "film-ov-bot@users.noreply.github.com"
          git add data
          git commit -m "Dati del $(date -u +%Y-%m-%d)" || echo "No changes"
          git pull --rebase -q && git push

      - name: Open an issue if a cinema disappeared
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s data/alerts.txt ]; then
            gh issue create --title "Controllare: problemi nel run del $(date -u +%Y-%m-%d)" --body-file data/alerts.txt
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
