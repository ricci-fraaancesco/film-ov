<title>Film OV</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: a dark "screen" band carries the search like a subtitle line; below it, paper-light listings where every showtime is a ticket stub that books. */
:root {
  --bg: #EDF0F4;
  --surface: #FFFFFF;
  --ink: #121821;
  --muted: #586273;
  --line: #D3D9E1;
  --link: #1B4FC4;
  --screen: #0B0F15;
  --screen-ink: #E9EDF2;
  --screen-muted: #8E99A8;
  --sub: #FFD23F;
  --sub-ink: #1A1400;
  --chip: #F6F8FA;
  --focus: #1B4FC4;
  --f-display: "Big Shoulders Display", "Arial Narrow", "Roboto Condensed", Impact, sans-serif;
  --f-body: "Hanken Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 6px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E131A; --surface: #161D26; --ink: #E7EBF0; --muted: #9AA5B5; --line: #29323E;
    --link: #9DBBFF; --screen: #05080C; --screen-ink: #E9EDF2; --screen-muted: #8E99A8;
    --sub: #FFD23F; --sub-ink: #1A1400; --chip: #1C2430; --focus: #9DBBFF; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E131A; --surface: #161D26; --ink: #E7EBF0; --muted: #9AA5B5; --line: #29323E;
  --link: #9DBBFF; --screen: #05080C; --screen-ink: #E9EDF2; --screen-muted: #8E99A8;
  --sub: #FFD23F; --sub-ink: #1A1400; --chip: #1C2430; --focus: #9DBBFF; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--screen); }
a { color: var(--link); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 3px; }
.wrap { max-width: 1080px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { text-wrap: balance; margin: 0; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- top bar / screen ---------- */
.top { background: var(--screen); color: var(--screen-ink); position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; }
.top .bar { display: flex; align-items: center; gap: 20px; padding-block: 12px; }
.brand { display: flex; align-items: baseline; gap: 6px; color: var(--screen-ink); font-family: var(--f-display); font-weight: 900; font-size: 26px; letter-spacing: .02em; text-transform: uppercase; white-space: nowrap; }
.brand:hover { text-decoration: none; }
.brand .ov { background: var(--sub); color: var(--sub-ink); padding: 0 6px; border-radius: 3px; }
.slot-bar { flex: 1; min-width: 0; }
.top.home { position: relative; }
.top.home .slot-bar { display: none; }

.hero { padding-block: 40px 56px; display: grid; gap: 22px; }
.hero h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(44px, 8vw, 88px); line-height: .92; letter-spacing: .005em; text-transform: uppercase; max-width: 14ch; }
.subline { display: inline-block; justify-self: start; font-size: clamp(16px, 2.2vw, 20px); color: var(--sub); font-weight: 600; background: rgba(0,0,0,.55); padding: 4px 10px; border-radius: 2px; }
.hero .meta { color: var(--screen-muted); font-size: 14px; }
.hero .meta b { color: var(--screen-ink); font-weight: 600; }

/* ---------- search ---------- */
.search { position: relative; }
.search .field { display: flex; align-items: center; gap: 10px; background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 0 12px; border: 2px solid transparent; }
.search .field:focus-within { border-color: var(--sub); }
.search svg { flex: none; color: var(--muted); }
.search input { flex: 1; min-width: 0; border: 0; outline: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; padding-block: 10px; }
.search input::placeholder { color: var(--muted); }
.search kbd { font-family: var(--f-mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; }
.hero .search .field { padding: 4px 16px; }
.hero .search input { font-size: 19px; padding-block: 14px; }
.results { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: var(--r); box-shadow: 0 18px 40px rgba(5,10,20,.28); max-height: min(70vh, 520px); overflow-y: auto; padding-block: 6px; z-index: 40; }
.results .grp { padding: 10px 14px 4px; }
.results .opt { display: flex; align-items: center; gap: 12px; padding: 8px 14px; cursor: pointer; color: var(--ink); }
.results .opt:hover, .results .opt[aria-selected="true"] { background: var(--chip); text-decoration: none; }
.results .opt .ic { flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 4px; background: var(--chip); color: var(--muted); font-family: var(--f-display); font-weight: 800; font-size: 15px; }
.results .opt[aria-selected="true"] .ic { background: var(--sub); color: var(--sub-ink); }
.results .opt .tx { min-width: 0; }
.results .opt .lb { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results .opt .sb { font-size: 13px; color: var(--muted); display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results mark { background: transparent; color: inherit; box-shadow: inset 0 -0.42em 0 color-mix(in srgb, var(--sub) 70%, transparent); }
.results .empty { padding: 14px; color: var(--muted); font-size: 14px; }
.results .hint { padding: 8px 14px 4px; font-size: 13px; color: var(--muted); }

/* ---------- page ---------- */
main { padding-block: 32px 64px; display: grid; gap: 40px; }
.crumbs { font-size: 14px; color: var(--muted); display: flex; gap: 8px; flex-wrap: wrap; }
.crumbs span[aria-hidden] { opacity: .6; }
.head { display: grid; gap: 10px; }
.head h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(38px, 6vw, 64px); line-height: .95; text-transform: uppercase; letter-spacing: .005em; }
.head .facts { color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 16px; }
.head .facts b { color: var(--ink); font-weight: 600; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 7px 12px; border-radius: var(--r); font-size: 14px; font-weight: 600; }
.btn:hover { text-decoration: none; border-color: var(--ink); }
section { display: grid; gap: 16px; }
section > h2 { font-family: var(--f-display); font-weight: 800; font-size: 28px; text-transform: uppercase; letter-spacing: .01em; }
section > .lede { color: var(--muted); margin-top: -10px; font-size: 15px; }

.badge { display: inline-block; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 7px; border-radius: 3px; background: var(--chip); color: var(--muted); border: 1px solid var(--line); vertical-align: 2px; }
.badge.vo { background: var(--sub); color: var(--sub-ink); border-color: transparent; }
.lang { color: var(--muted); font-size: 14px; }

/* ticket-stub showtime */
.times { display: flex; flex-wrap: wrap; gap: 8px; }
.tix { display: inline-flex; align-items: stretch; border: 1px solid var(--line); background: var(--chip); border-radius: 4px; color: var(--ink); font-size: 13px; line-height: 1.2; overflow: hidden; }
.tix b { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; font-size: 15px; padding: 7px 9px; }
.tix span { padding: 7px 9px 7px 8px; border-left: 1px dashed var(--line); color: var(--muted); display: flex; align-items: center; max-width: 16ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tix:hover { text-decoration: none; background: var(--screen); color: var(--sub); border-color: var(--screen); }
.tix:hover span { color: var(--screen-ink); border-left-color: var(--screen-muted); }
.howto { font-size: 13px; color: var(--muted); }

/* posters (from the cinemas) */
.thumb { flex: none; width: 56px; height: 84px; border-radius: 3px; object-fit: cover; background: var(--screen); border: 1px solid var(--line); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 24px; color: var(--sub); }
.row .t.thumbed { display: flex; gap: 16px; align-items: flex-start; }
.tt { display: grid; gap: 3px; min-width: 0; }
.credit { font-size: 14px; color: var(--muted); }
.credit i { font-style: normal; color: var(--ink); }
.results .opt img.ic { width: 30px; height: 45px; object-fit: cover; padding: 0; }

/* poster wall: the lobby of the site */
.posters { display: grid; grid-template-columns: repeat(auto-fill, minmax(156px, 1fr)); gap: 28px 18px; }
.pcard { display: grid; gap: 8px; align-content: start; color: var(--ink); min-width: 0; }
.pcard:hover { text-decoration: none; }
.pimg { position: relative; aspect-ratio: 2 / 3; border-radius: 4px; overflow: hidden; background: var(--screen); box-shadow: 0 1px 0 var(--line), 0 10px 24px -14px rgba(5, 10, 20, .55); }
.pimg img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .25s ease; }
.pcard:hover .pimg img { transform: scale(1.03); }
.pimg .ph { position: absolute; inset: 0; display: grid; align-content: center; padding: 14px; font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: .95; text-transform: uppercase; color: var(--screen-ink); text-wrap: balance; overflow-wrap: anywhere; }
.pimg .subt { position: absolute; left: 0; right: 0; bottom: 0; padding: 22px 8px 8px; text-align: center; font-size: 12px; font-weight: 600; color: var(--sub); background: linear-gradient(transparent, rgba(0, 0, 0, .78) 45%); text-shadow: 0 1px 2px rgba(0, 0, 0, .8); }
.pcard b { font-size: 16px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.pcard .pm { font-size: 13px; color: var(--muted); line-height: 1.35; }
.pcard .pn { font-size: 13px; color: var(--ink); font-weight: 600; }
.pcard .pn .mono { font-weight: 600; }
.more { justify-self: start; }

/* film page: the screen band carries the film */
.band { display: block; position: relative; overflow: hidden; background: var(--screen); color: var(--screen-ink); }
.band .bg { position: absolute; inset: -60px; background-size: cover; background-position: center; filter: blur(40px) saturate(1.3); opacity: .38; transform: scale(1.1); }
.band::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(5, 8, 12, .92) 0%, rgba(5, 8, 12, .55) 60%, rgba(5, 8, 12, .8) 100%); }
.band .wrap { position: relative; z-index: 1; padding-block: 28px 40px; display: grid; gap: 18px; }
.band .crumbs, .band .crumbs a { color: var(--screen-muted); }
.film-head { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 36px; align-items: start; }
.film-head .fh-text { display: grid; gap: 12px; min-width: 0; align-content: start; }
.film-head h1 { font-family: var(--f-display); font-weight: 800; font-size: clamp(40px, 6vw, 72px); line-height: .93; text-transform: uppercase; letter-spacing: .005em; }
.poster { width: 100%; max-width: 240px; aspect-ratio: 2 / 3; height: auto; object-fit: cover; border-radius: 4px; background: #000; box-shadow: 0 24px 50px -20px rgba(0, 0, 0, .9); }
.orig { color: var(--screen-muted); font-size: 15px; }
.orig i { font-style: normal; color: var(--screen-ink); font-weight: 600; }
.band .facts { color: var(--screen-muted); display: flex; flex-wrap: wrap; gap: 6px 16px; }
.band .facts b { color: var(--screen-ink); }
.plot { margin: 0; max-width: 62ch; font-size: 17px; line-height: 1.55; color: var(--screen-ink); }
.plot .src { font-size: 13px; color: var(--screen-muted); }
.band .btn { background: transparent; color: var(--screen-ink); border-color: rgba(255, 255, 255, .25); }
.band .btn:hover { border-color: var(--sub); color: var(--sub); }
.band .btn.primary { background: var(--sub); color: var(--sub-ink); border-color: var(--sub); }
.band .btn.primary:hover { color: var(--sub-ink); filter: brightness(1.05); }

/* cards and rows */
.cities { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; }
.city { display: grid; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; color: var(--ink); }
.city:hover { text-decoration: none; border-color: var(--ink); }
.city h3 { font-family: var(--f-display); font-weight: 800; font-size: 34px; text-transform: uppercase; line-height: 1; }
.city .n { color: var(--muted); font-size: 14px; }
.city .n b { color: var(--ink); }

.list { display: grid; border-top: 1px solid var(--line); }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 20px; padding-block: 16px; border-bottom: 1px solid var(--line); align-items: start; }
.row .t { display: grid; gap: 4px; min-width: 0; }
.row .t h3 { font-size: 19px; font-weight: 700; line-height: 1.25; }
.row .t h3 a { color: var(--ink); }
.row .sm { font-size: 14px; color: var(--muted); }
.row .side { text-align: right; font-size: 14px; color: var(--muted); white-space: nowrap; }
.row .side b { color: var(--ink); font-family: var(--f-mono); font-weight: 600; }
.row .times { grid-column: 1 / -1; }
.films-inline { font-size: 14px; color: var(--muted); }
.films-inline a { color: var(--ink); }

.next { display: grid; border-top: 1px solid var(--line); }
.next a.item { display: grid; grid-template-columns: 72px minmax(0,1fr) auto; gap: 14px; align-items: baseline; padding-block: 12px; border-bottom: 1px solid var(--line); color: var(--ink); }
.next a.item:hover { text-decoration: none; background: var(--surface); }
.next .when { font-family: var(--f-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.next .when small { display: block; font-family: var(--f-body); font-weight: 500; font-size: 12px; color: var(--muted); }
.next .what { min-width: 0; }
.next .what b { display: block; font-weight: 700; }
.next .what span { font-size: 14px; color: var(--muted); }
.next .city-tag { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.days { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: thin; }
.day { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: var(--r); padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; display: grid; text-align: left; line-height: 1.2; }
.day small { color: var(--muted); font-size: 12px; }
.day[aria-pressed="true"] { background: var(--screen); color: var(--sub); border-color: var(--screen); }
.day[aria-pressed="true"] small { color: var(--screen-muted); }

.daygrid { display: grid; grid-template-columns: 110px minmax(0, 1fr); gap: 8px 16px; align-items: center; }
.daygrid .dl { font-size: 14px; font-weight: 600; }
.daygrid .dl small { display: block; font-weight: 500; color: var(--muted); font-size: 12px; }
.cin-block { display: grid; gap: 12px; padding-block: 18px; border-bottom: 1px solid var(--line); }
.cin-block h3 { font-size: 19px; font-weight: 700; }
.cin-block h3 a { color: var(--ink); }
.city-h { font-family: var(--f-display); font-weight: 800; font-size: 30px; text-transform: uppercase; display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--ink); padding-bottom: 4px; }
.city-h small { font-family: var(--f-body); font-size: 14px; font-weight: 500; color: var(--muted); text-transform: none; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.note { font-size: 14px; color: var(--muted); max-width: 65ch; }
.note b { color: var(--ink); font-weight: 600; }

footer { border-top: 1px solid var(--line); padding-block: 24px 40px; color: var(--muted); font-size: 13px; }
footer .wrap { display: grid; gap: 6px; }
.stale { background: var(--sub); color: var(--sub-ink); font-size: 14px; padding-block: 8px; }

@media (max-width: 640px) {
  .top .bar { gap: 12px; }
  .brand { font-size: 22px; }
  .search kbd { display: none; }
  .row { grid-template-columns: minmax(0, 1fr); }
  .row .side { text-align: left; }
  .daygrid { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .daygrid .times { margin-bottom: 8px; }
  .next a.item { grid-template-columns: 60px minmax(0,1fr); }
  .next .city-tag { grid-column: 2; }
  .film-head { grid-template-columns: 112px minmax(0, 1fr); gap: 16px; }
  .film-head h1 { font-size: clamp(30px, 9vw, 44px); }
  .film-head .plot, .film-head .actions { grid-column: 1 / -1; }
  .film-head .fh-text { display: contents; }
  .film-head .fh-top { grid-column: 2; display: grid; gap: 8px; align-content: start; }
  .posters { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 14px; }
  .thumb { width: 46px; height: 69px; }
}
@media (prefers-reduced-motion: no-preference) {
  main { animation: in .25s ease-out both; }
  @keyframes in { from { transform: translateY(4px); } to { opacity: 1; transform: none; } }
}
</style>

<header class="top" id="top">
  <div class="wrap bar">
    <a class="brand" href="#" aria-label="Film OV, home">Film <span class="ov">OV</span></a>
    <div class="slot-bar" id="slotBar"></div>
  </div>
  <div class="wrap hero" id="hero">
    <span class="eyebrow" style="color:var(--screen-muted)">Versione originale · Roma · Bologna · Firenze · Napoli</span>
    <h1>Il film, nella sua lingua.</h1>
    <span class="subline">Tutti gli spettacoli in versione originale, con link diretto alla prenotazione.</span>
    <div id="slotHero"></div>
    <div class="meta" id="heroMeta"></div>
  </div>
</header>

<form class="search" id="search" role="search" autocomplete="off">
  <div class="field">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
    <input id="q" type="search" placeholder="Cerca un film, un cinema o una città" aria-label="Cerca un film, un cinema o una città" role="combobox" aria-expanded="false" aria-controls="results" aria-autocomplete="list">
    <kbd>/</kbd>
  </div>
  <div class="results" id="results" role="listbox" hidden></div>
</form>

<div id="staleBar" hidden></div>
<section class="band" id="band" hidden aria-label="Scheda del film"></section>
<main class="wrap" id="view"></main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
const D = __DATA__;
const TZ = "Europe/Rome";
const CIN = D.cinemas, FILM = D.films;
const ALL = D.shows.map(s => ({ c: s[0], f: s[1], t: s[2] * 60000, sc: s[3], lab: s[4], fmt: s[5], u: "https://" + s[6] + "#theater-init" }));
let NOW = Date.now();
const STALE = !ALL.some(s => s.t >= NOW);
if (STALE) NOW = new Date(D.updated).getTime();
const SH = ALL.filter(s => s.t >= NOW);

const fmtDayKey = new Intl.DateTimeFormat("en-CA", { timeZone: TZ, year: "numeric", month: "2-digit", day: "2-digit" });
const fmtTime = new Intl.DateTimeFormat("it-IT", { timeZone: TZ, hour: "2-digit", minute: "2-digit" });
const fmtWd = new Intl.DateTimeFormat("it-IT", { timeZone: TZ, weekday: "short" });
const fmtDm = new Intl.DateTimeFormat("it-IT", { timeZone: TZ, day: "numeric", month: "short" });
const fmtUpd = new Intl.DateTimeFormat("it-IT", { timeZone: TZ, day: "numeric", month: "long", hour: "2-digit", minute: "2-digit" });
const dayKey = t => fmtDayKey.format(new Date(t));
const TODAY = dayKey(NOW), TOMORROW = dayKey(NOW + 864e5);
const hhmm = t => fmtTime.format(new Date(t));
function dayLabel(t) { const k = dayKey(t); if (k === TODAY) return "Oggi"; if (k === TOMORROW) return "Domani"; return cap(fmtWd.format(new Date(t)).replace(".", "")); }
const dayDate = t => fmtDm.format(new Date(t)).replace(".", "");
const whenShort = t => { const k = dayKey(t); return (k === TODAY ? "oggi" : k === TOMORROW ? "domani" : fmtWd.format(new Date(t)).replace(".", "") + " " + dayDate(t)) + " " + hhmm(t); };
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const plural = (n, one, many) => n + " " + (n === 1 ? one : many);
const groupBy = (arr, fn) => arr.reduce((m, x) => { const k = fn(x); (m.get(k) || m.set(k, []).get(k)).push(x); return m; }, new Map());

const CITY_NAMES = Object.keys(D.cities);

/* ---------------- search ---------------- */
const norm = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
const STOP = new Set(["a", "in", "di", "da", "al", "il", "la", "lo", "le", "the", "of", "at", "e", "and", "vo", "vos", "ov", "versione", "originale", "original", "film", "cinema", "spettacoli", "orari", "stasera", "oggi"]);
const CITY_ALIAS = { roma: "Roma", rome: "Roma", rom: "Roma", bologna: "Bologna", bo: "Bologna", firenze: "Firenze", florence: "Firenze", florenz: "Firenze", napoli: "Napoli", naples: "Napoli", neapel: "Napoli" };

function lev(a, b, max) {
  if (Math.abs(a.length - b.length) > max) return max + 1;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i]; let rowMin = i;
    for (let j = 1; j <= b.length; j++) {
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
      rowMin = Math.min(rowMin, cur[j]);
    }
    if (rowMin > max) return max + 1;
    prev = cur;
  }
  return prev[b.length];
}
function tokScore(q, words) {
  let best = 0;
  const maxEd = q.length >= 7 ? 2 : q.length >= 4 ? 1 : 0;
  for (const w of words) {
    if (w === q) return 3;
    if (w.startsWith(q)) best = Math.max(best, 2 + q.length / (w.length * 10));
    else if (q.length >= 3 && w.includes(q)) best = Math.max(best, 1.2);
    else if (maxEd && best < 1) {
      const d = Math.min(lev(q, w, maxEd), w.length > q.length ? lev(q, w.slice(0, q.length), maxEd) : 99);
      if (d <= maxEd) best = Math.max(best, 1 - d * 0.2);
    }
  }
  return best;
}

const IDX = [];
CITY_NAMES.forEach(c => {
  const sh = showsOfCity(c), cins = new Set(sh.map(s => s.c));
  if (!sh.length) return;
  IDX.push({ type: "city", city: c, label: c, sub: `${plural(cins.size, "cinema", "cinema")} · ${plural(sh.length, "spettacolo", "spettacoli")} in VO`, href: "#c-" + citySlug(c), words: norm(c + " " + (D.cities[c].en || "")).split(" "), w: 0.6 });
});
CIN.forEach((c, i) => {
  const sh = SH.filter(s => s.c === i);
  const extra = c.n.replace(/^(Cinema|Multisala|Pop Up Cinema|Sala)\s+/i, "");
  IDX.push({ type: "cinema", city: c.c, label: c.n, sub: [c.c, c.z, sh.length ? plural(new Set(sh.map(s => s.f)).size, "film", "film") + " in VO" : "nessun film in VO al momento"].filter(Boolean).join(" · "), href: "#s-" + c.id, words: norm(c.n + " " + extra + " " + c.z + " " + c.a).split(" "), w: sh.length ? 0.3 : -0.4 });
});
FILM.forEach((f, i) => {
  const sh = SH.filter(s => s.f === i);
  if (!sh.length) return;
  IDX.push({ type: "film", fi: i, label: f.t, cities: new Set(sh.map(s => CIN[s.c].c)), words: norm([f.t, f.ot || "", (f.al || []).join(" "), f.y || "", f.d || "", f.l, f.lr || ""].join(" ")).split(" "), w: Math.min(0.4, Math.log10(sh.length + 1) / 4), n: sh });
});

function filmSub(e, city) {
  const sh = city ? e.n.filter(s => CIN[s.c].c === city) : e.n;
  const cins = new Set(sh.map(s => s.c));
  const where = cins.size === 1 ? CIN[[...cins][0]].n : plural(cins.size, "cinema", "cinema");
  return [FILM[e.fi].y, FILM[e.fi].l, where + (city ? "" : ", " + [...new Set(sh.map(s => CIN[s.c].c))].join(", ")), "prossimo " + whenShort(sh[0].t)].filter(Boolean).join(" · ");
}

function search(raw) {
  const qt = norm(raw).split(" ").filter(Boolean);
  if (!qt.length) return null;
  let city = null;
  let toks = qt.filter(t => { if (qt.length > 1 && CITY_ALIAS[t] && !city) { city = CITY_ALIAS[t]; return false; } return true; });
  const meaningful = toks.filter(t => !STOP.has(t));
  if (meaningful.length) toks = meaningful;
  if (!toks.length && city) toks = [norm(city)];
  const out = [];
  for (const e of IDX) {
    if (city && e.type === "city") continue;
    if (city && e.type === "cinema" && e.city !== city) continue;
    if (city && e.type === "film" && !e.cities.has(city)) continue;
    let sum = 0, ok = true;
    for (const t of toks) { const s = tokScore(t, e.words); if (!s) { ok = false; break; } sum += s; }
    if (!ok) continue;
    out.push({ e, score: sum / toks.length + e.w });
  }
  out.sort((a, b) => b.score - a.score);
  const groups = { city: [], cinema: [], film: [] };
  const lim = { city: 3, cinema: 5, film: 7 };
  for (const r of out) if (groups[r.e.type].length < lim[r.e.type]) groups[r.e.type].push(r);
  const order = Object.keys(groups).filter(k => groups[k].length).sort((a, b) => groups[b][0].score - groups[a][0].score);
  return { city, toks, order, groups };
}

function highlight(label, toks) {
  let html = esc(label);
  const n = [...label].map(ch => (ch.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9]/g, " ") || " ")[0]).join("");
  if (n.length !== label.length) return html;
  const marks = [];
  toks.forEach(t => { const re = new RegExp("(^|[^a-z0-9])(" + t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "g"); let m; while ((m = re.exec(n))) marks.push([m.index + m[1].length, m.index + m[1].length + t.length]); });
  if (!marks.length) return html;
  marks.sort((a, b) => a[0] - b[0]);
  let res = "", pos = 0;
  for (const [a, b] of marks) { if (a < pos) continue; res += esc(label.slice(pos, a)) + "<mark>" + esc(label.slice(a, b)) + "</mark>"; pos = b; }
  return res + esc(label.slice(pos));
}

const form = document.getElementById("search"), qEl = document.getElementById("q"), resEl = document.getElementById("results");
let opts = [], active = -1;
const ICON = { city: "C", cinema: "S", film: "F" };
const GRP = { city: "Città", cinema: "Cinema", film: "Film" };

function suggestions() {
  const cities = IDX.filter(e => e.type === "city").map(e => ({ e }));
  const films = IDX.filter(e => e.type === "film").sort((a, b) => b.n.length - a.n.length).slice(0, 4).map(e => ({ e }));
  return { city: null, toks: [], order: ["city", "film"], groups: { city: cities, film: films, cinema: [] }, suggest: true };
}
function renderResults() {
  const v = qEl.value;
  const r = v.trim() ? search(v) : suggestions();
  opts = []; active = -1;
  let html = "";
  if (r.city) html += `<div class="hint">Risultati a <b>${esc(r.city)}</b></div>`;
  if (!r.order.length) html += `<div class="empty">Nessun risultato per “${esc(v.trim())}”. Prova con il titolo originale o italiano, un cinema o una città.</div>`;
  for (const k of r.order) {
    html += `<div class="grp eyebrow">${r.suggest && k === "film" ? "Più programmati" : GRP[k]}</div>`;
    for (const { e } of r.groups[k]) {
      const href = e.type === "film" ? "#f-" + FILM[e.fi].id + (r.city ? "~" + citySlug(r.city) : "") : e.href;
      const sub = e.type === "film" ? filmSub(e, r.city) : e.sub;
      const i = opts.length; opts.push(href);
      html += `<a class="opt" role="option" id="opt${i}" href="${href}" aria-selected="false">${e.type === "film" && FILM[e.fi].p ? `<img class="ic" src="${esc(FILM[e.fi].ps || FILM[e.fi].p)}" alt="" loading="lazy" data-ph="F">` : `<span class="ic" aria-hidden="true">${ICON[e.type]}</span>`}<span class="tx"><span class="lb">${highlight(e.label, r.toks)}</span><span class="sb">${esc(sub)}</span></span></a>`;
    }
  }
  resEl.innerHTML = html;
  resEl.hidden = false; qEl.setAttribute("aria-expanded", "true");
}
function closeResults() { resEl.hidden = true; qEl.setAttribute("aria-expanded", "false"); qEl.removeAttribute("aria-activedescendant"); }
function setActive(i) {
  if (!opts.length) return;
  active = (i + opts.length) % opts.length;
  resEl.querySelectorAll(".opt").forEach((o, j) => o.setAttribute("aria-selected", j === active ? "true" : "false"));
  const el = document.getElementById("opt" + active); el.scrollIntoView({ block: "nearest" });
  qEl.setAttribute("aria-activedescendant", "opt" + active);
}
qEl.addEventListener("input", renderResults);
qEl.addEventListener("focus", renderResults);
qEl.addEventListener("keydown", e => {
  if (e.key === "ArrowDown") { e.preventDefault(); if (resEl.hidden) renderResults(); setActive(active + 1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); setActive(active - 1); }
  else if (e.key === "Escape") { closeResults(); }
});
form.addEventListener("submit", e => { e.preventDefault(); const href = opts[active >= 0 ? active : 0]; if (href) go(href); });
resEl.addEventListener("mousedown", e => e.preventDefault());
resEl.addEventListener("click", e => { const a = e.target.closest("a.opt"); if (a) { e.preventDefault(); go(a.getAttribute("href")); } });
qEl.addEventListener("blur", () => setTimeout(closeResults, 120));
document.addEventListener("keydown", e => { if (e.key === "/" && document.activeElement !== qEl && !/input|textarea/i.test(document.activeElement.tagName)) { e.preventDefault(); qEl.focus(); } });
function go(href) { closeResults(); qEl.value = ""; qEl.blur(); if (location.hash === href) route(); else location.hash = href; }

function filmsByRank(shows) {

  return [...groupBy(shows, s => s.f)].sort((a, b) => new Set(b[1].map(s => s.c)).size - new Set(a[1].map(s => s.c)).size || b[1].length - a[1].length || a[1][0].t - b[1][0].t);
}

  const cinN = new Set(sh.map(s => s.c)).size;
  const filt = cities.length > 1 ? `<div class="filters" role="group" aria-label="Filtra per città"><a class="day" href="#f-${F.id}" aria-pressed="${!city}">Tutte <small>${sh.length}</small></a>${cities.map(([c, l]) => `<a class="day" href="#f-${F.id}~${citySlug(c)}" aria-pressed="${c === city}">${esc(c)} <small>${l.length}</small></a>`).join("")}</div>` : "";
  const plot = F.o ? `<p class="plot">${esc(F.o)}</p>` : F.in ? `<p class="plot">${esc(F.in)} <span class="src">(da Wikipedia)</span></p>` : "";
  const next = sh[0];
  route.band = `${F.p ? `<div class="bg" style="background-image:url('${esc(F.p).replace(/'/g, "%27")}')"></div>` : ""}
  <div class="wrap">${crumbs([["Home", "#"], ...(city ? [[city, "#c-" + citySlug(city)]] : []), [F.t]])}
    <div class="film-head" style="${F.p ? "" : "grid-template-columns:minmax(0,1fr)"}">${F.p ? `<img class="poster" src="${esc(F.p)}" alt="Locandina di ${esc(F.t)}" width="240" height="360">` : ""}
      <div class="fh-text"><div class="fh-top"><h1>${esc(F.t)}</h1>
        ${F.ot ? `<div class="orig">Titolo originale: <i>${esc(F.ot)}</i></div>` : ""}
        ${credit(F) || F.g ? `<div class="orig">${[credit(F), F.g ? esc(F.g) : ""].filter(Boolean).join(" · ")}</div>` : ""}
        <div class="facts"><span><span class="badge vo">VO</span> <b>${esc(F.l)}</b>${F.s ? " · " + esc(F.s) : ""}</span><span>in <b>${plural(cinN, "cinema", "cinema")}</b></span><span><b>${sh.length}</b> spettacoli</span></div></div>
        ${plot}
        <div class="actions">${next ? `<button type="button" class="btn primary" data-scroll="where">Orari e prenotazione</button>` : ""}${F.wp ? `<a class="btn" href="https://it.wikipedia.org/wiki/${encodeURIComponent(F.wp.replace(/ /g, "_"))}" target="_blank" rel="noopener">Wikipedia ↗</a>` : ""}</div>
      </div></div></div>`;
  return `
  <section aria-labelledby="h-where" id="where"><h2 id="h-where">Dove e quando</h2>
    ${filt}
    ${sh.length ? `<p class="howto">Tocca un orario per prenotare sul sito del cinema.</p>` : `<p class="note">Nessuno spettacolo in programma.</p>`}
    ${shown.map(([c, l]) => `<div><h3 class="city-h">${esc(c)} <small>${plural(new Set(l.map(s => s.c)).size, "cinema", "cinema")}</small></h3>
      ${[...groupBy(l, s => s.c)].map(([ci, cl]) => { const C = CIN[ci]; return `<div class="cin-block"><h3><a href="#s-${C.id}">${esc(C.n)}</a> <span class="lang">${esc(C.z || "")}</span></h3>
        <div class="daygrid">${[...groupBy(cl, s => dayKey(s.t))].map(([k, dl]) => `<div class="dl">${dayLabel(dl[0].t)}<small>${dayDate(dl[0].t)}</small></div><div class="times">${dl.map(tixHtml).join("")}</div>`).join("")}</div></div>`; }).join("")}</div>`).join("")}</section>`;
}

function viewNotFound() {
  return `<div class="head">${crumbs([["Home", "#"]])}<h1>Pagina non trovata</h1><p class="note">Questo indirizzo non corrisponde a nessun film, cinema o città. Usa la ricerca qui sopra.</p></div>`;
}

const topEl = document.getElementById("top"), hero = document.getElementById("hero");
function route() {
  const h = decodeURIComponent(location.hash.replace(/^#/, ""));
  let html, title = "Film OV", isHome = false, ci;
  route.band = "";
  if (!h) { html = viewHome(); isHome = true; }
  else if (h.startsWith("c-") && cityBySlug(h.slice(2))) { const c = cityBySlug(h.slice(2)); html = viewCity(c); title = `Film in VO a ${c} · Film OV`; }
  else if (h.startsWith("s-") && (ci = cinById(h.slice(2))) >= 0) { if (route.lastCin !== ci) cinDay = null; route.lastCin = ci; html = viewCinema(ci); title = `${CIN[ci].n} · Film OV`; }
  else if (h === "film" || h.startsWith("film~")) { const cs = h.split("~")[1]; html = viewAllFilms(cs); title = "Tutti i film in VO · Film OV"; }
  else if (h.startsWith("f-")) { const [id, cs] = h.slice(2).split("~"); const fi = filmById(id); if (fi >= 0) { html = viewFilm(fi, cs); title = `${FILM[fi].t} in VO · Film OV`; } else html = viewNotFound(); }
  else html = viewNotFound();
  topEl.classList.toggle("home", isHome);
  hero.hidden = !isHome;
  (isHome ? document.getElementById("slotHero") : document.getElementById("slotBar")).appendChild(form);
  view.innerHTML = html;
  const band = document.getElementById("band");
  band.innerHTML = route.band; band.hidden = !route.band;
  route.lastHash = location.hash;
  document.title = title;
  if (!route.keepScroll) window.scrollTo(0, 0);
  route.keepScroll = false;
}
view.addEventListener("click", e => {
  const b = e.target.closest("button.day[data-day]");
  if (!b) return;
  cinDay = b.dataset.day; route.keepScroll = true; route();
});
document.getElementById("band").addEventListener("click", e => {
  const b = e.target.closest("[data-scroll]");
  if (b) document.getElementById(b.dataset.scroll)?.scrollIntoView({ behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" });
});
window.addEventListener("hashchange", route);

/* ---------------- static bits ---------------- */
const covered = new Set(ALL.map(s => s.c)).size;
document.getElementById("heroMeta").innerHTML = `<b>${SH.length}</b> spettacoli in VO · <b>${new Set(SH.map(s => s.f)).size}</b> film · <b>${new Set(SH.map(s => s.c)).size}</b> cinema`;
document.getElementById("foot").innerHTML = `<span>Programmazione letta dalle pagine pubbliche di vendita dei cinema (18tickets), aggiornata il ${esc(fmtUpd.format(new Date(D.updated)))}.</span><span>Orari e lingua possono cambiare: verifica sempre sulla pagina di prenotazione del cinema. Prototipo, copertura parziale.</span><span>Locandine e trame dalle pagine dei cinema. Dati sui film da <a href="https://www.wikidata.org" target="_blank" rel="noopener">Wikidata</a> (CC0) e descrizioni brevi da <a href="https://it.wikipedia.org" target="_blank" rel="noopener">Wikipedia</a> (<a href="https://creativecommons.org/licenses/by-sa/4.0/deed.it" target="_blank" rel="noopener">CC BY-SA 4.0</a>).</span>`;
if (STALE) { const s = document.getElementById("staleBar"); s.className = "stale"; s.innerHTML = `<div class="wrap">Questi dati sono del ${esc(fmtUpd.format(new Date(D.updated)))} e potrebbero non essere più validi.</div>`; s.hidden = false; }
route();
</script>
